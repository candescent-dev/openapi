  /v1/oauth/token:
    post:
      summary: Create V1 access token (Legacy)
      description: >
        **Legacy V1 Token Endpoint** - Use this endpoint for V1 APIs only (Send
        Event, Destinations, Get FI Customer, Register User).


        Allows a registered application to obtain an OAuth 2.0 Bearer Token for
        accessing legacy Digital Insight APIs.


        **Supported Grant Types:**

        - **password**: Used when the customer's digital banking credentials are
        known. Response includes customer's member ID and token scope is
        restricted to that customer.

        - **client_credentials**: Used when acting on behalf of a customer
        without their credentials. Response does not contain customer-specific
        data.


        **Token Expiration:** 30 minutes


        **Note:** For most current APIs (Accounts, Alerts, Banking Images,
        Disclosures, Money Movement, Transactions), use the V2 token endpoint
        (`POST /oauth2/v1/token`) instead.
      operationId: createLegacyTokenV1
      tags:
        - Authentication
      parameters:
        - name: di_tid
          in: header
          description: >
            Unique id used to identify the request. The id allows the request to
            be traced through the entire request

            and response flow.

            The expected id is a UUID, in the canonical form e.g
            123e4567-e89b-12d3-a456-426655440000
          required: true
          schema:
            type: string
        - name: user-agent
          in: header
          description: >
            Identifies the application and the platform making the request.

            The expected format is
            `{Appname}/{Appversion}[/{DeviceID}][;{Platform User-Agent}]` e.g.
            iPhone/1.0/abc12345;Nokia3110
          required: false
          schema:
            type: string
        - name: di_fiid
          in: header
          description: >
            The financial institution for which the authentication token is
            being requested.

            The scope of the OAuth2.0 token will be restricted to this Financial
            Institution.
          required: true
          schema:
            type: string
        - name: offering_id
          in: header
          description: >
            Uniquely identifies the name of the client app making the request.

            When not provided this is derived based on a property held against
            the application within Apigee
          required: false
          schema:
            type: string
        - name: originating_ip
          in: header
          description: >
            The IP address of the device making the request for authentication.

            If not provided the IP address logged will be the IP address
            extracted from the HTTP request.

            **Note:** this should be the originating device, rather than the
            client making the request e.g. if a mobile device

            is used the ip address should be that of the mobile device, rather
            than a back end service
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          description: >
            Standard HTTP Basic Authentication based on the `Client ID` and
            `Client Secret` provided during

            the application registration process.

            A string composed of `Basic`+ `(space)` + `base64encode(client_id +
            ":" + client_secret)`; example `Basic
            ODU4S0pRczVXwGdMRkhUUUhtSGhNdTRYHlpRa3N1ZGY6STA0UThtMFJZZEF1dUlwYg`
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  description: >
                    The OAuth grant type, defaults to `password` grant type,
                    with `client_credentials` also being

                    supported.

                    A grant type of `password` should be used when the
                    customer's digital banking credentials are known.



                    A grant type of `client_credentials` should be used when the
                    request is either non-customer specific or

                    the customer''s digital banking credentials are not
                    available.'
                  type: string
                  default: password
                username:
                  description: >-
                    The customer's digital banking login id.


                    **Note:** This parameter is mandatory when the `password`
                    grant type is specified
                  type: string
                password:
                  description: >-
                    The customer's digital banking password.


                    **Note:** This parameter is mandatory when the `password`
                    grant type is specified
                  type: string
              required:
                - grant_type
        required: true
      responses:
        '200':
          description: Token successfully created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: >-
            Bad Request. Returned when the submitted request does not match the
            requirements defined in the specification
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Status1'
        '401':
          description: >-
            Unauthorized. Returned when the authentication request is
            unsuccessful
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Status1'
        '500':
          description: >-
            Internal Server Error. Returned when an unexpected fault occurs
            whilst processing the request
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Status1'
