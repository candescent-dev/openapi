  '/db-bb-core/v1/business-registrations/{registrationId}':
    get:
      description: >
        Retrieves a business banking registration using the unique registration
        ID. The registration ID is an alphanumeric code that was generated when
        the registration was created.


        **Response includes:**


        - Business information (name, address)

        - Primary business contact details

        - Administrator information

        - TIN details

        - Selected online features and services

        - Registration status and timestamps
      operationId: getBusinessRegistrationByIdV1
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'OAuth 2.0 access token for authentication. Format: ''Bearer {token}'''
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: transactionId
          in: header
          required: true
          description: >-
            UUID used to trace and correlate requests across services for
            debugging and logging.
          schema:
            type: string
            format: uuid
            example: f8187c63-678f-4f0c-9263-46723794661a
        - description: >
            The unique alphanumeric registrationId generated during registration
            creation.
          example: a78b4a7cf6134c34a5d8083323d378c7
          in: path
          name: registrationId
          required: true
          schema:
            example: FSUU58FY7X6N95TO
