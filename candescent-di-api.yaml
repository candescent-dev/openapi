      summary: Create recipient
      description: >
        Creates a new recipient record and optionally validates the provided
        information. Use this 

        endpoint to add new payees that can receive transfers.


        **Validation:**

        Set `validate=true` query parameter to validate the recipient exists at
        the institution 

        before saving. This performs a "lucky transfer" test to verify the
        account.
      operationId: createRecipientV1
      tags:
        - Money Movement
      parameters:
        - name: transactionId
          in: header
          description: A unique identifier for this request.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          description: >-
            Standard OAuth 2.0 access token. A string composed of 'Bearer' +
            '(space)' + '{token}'
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: hostUserId
          in: query
          required: false
          description: >
            Identifier for the user associated with the financial institution.
            This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `loginId` query parameter.
          schema:
            type: string
        - name: loginId
          in: query
          required: false
          description: >
            Login identifier for the user associated with the financial
            institution. This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `hostUserId` query parameter.
          schema:
            type: string
        - name: validate
          in: query
          description: >-
            When true, validates that the recipient exists at the institution
            before saving. Recommended to prevent transfers to invalid accounts.
          schema:
            type: boolean
        - name: fromAccountId
          in: query
          description: >-
            The account ID of the sender. Required when validate=true to perform
            the validation transfer test.
          schema:
            type: string
