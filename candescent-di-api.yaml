  '/groups/v3/groups/{groupId}/participants':
    put:
      summary: Upload group participants file
      description: >
        Uploads a CSV file containing participant IDs to add, remove, or replace
        users in an experience group.


        **File Requirements:**

        - Format: CSV file with participant IDs

        - Each participant ID must be 32 characters or less

        - File is submitted as multipart/form-data


        **Operation Types:**

        - `ADD`: Add new participants to the existing group members

        - `REMOVE`: Remove specified participants from the group

        - `REPLACE`: Replace all existing participants with the new list


        **Processing:**

        The upload creates an asynchronous job. Use the returned `jobId` to
        monitor progress 

        via the GET `/groups/v3/jobs/{jobId}` endpoint.
      operationId: uploadUserListFileV3
      tags:
        - Customer Campaigns
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: transactionId
          in: header
          description: >-
            Unique id used as fish tag and same id will be returned in the
            response.
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: >-
            An OAuth2 access token that authorizes this request. Must be in the
            format Bearer {ACCESS_TOKEN}
          required: true
          schema:
            type: string
            example: Bearer rvYKAItOGiMQy1yOHdUDAHWp2HG1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponseDTO'
              example:
                code: '1000'
                message: >-
                  File upload for file: shane5_list.csv and group:
                  9b573b07-296f-404b-a3e4-557a8f2aba87 was successful with
                  jobId: 377a8762-9ae4-454d-95dd-78c93554235a
                jobId: 377a8762-9ae4-454d-95dd-78c93554235a
                jobStatus: CREATED
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTO'
              example:
                code: '2001'
                message: Internal Server Error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTO'
              example:
                code: '2003'
                message: Invalid Authorization
