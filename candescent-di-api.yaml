    CustomerRequest:
      required:
        - fiId
        - memberNumber
        - firstName
        - lastName
        - emailAddress
        - contactInfo
        - birthDate
        - loginId
        - password
        - userType
        - ssn
        - motherMaidenName
        - hostPassword
        - postalAddress
      type: object
      properties:
        fiId:
          type: string
          pattern: '([0-9]{4,5})'
          example: 2509
          description: The financial institution id
        memberNumber:
          type: string
          pattern: '([A-Za-z0-9]{6,32})'
          minLength: 6
          maxLength: 32
          example: updatecnct01
          description: The member number of user
        firstName:
          type: string
          example: John
          description: >-
            First name of the user, combination of firstName, middleName and
            lastName length should not be greater than 39
        middleName:
          type: string
          example: John
          description: >-
            Middle name of the user, combination of firstName, middleName and
            lastName length should not be greater than 39
        lastName:
          type: string
          example: Wick
          description: >-
            Last name of the user, combination of firstName, middleName and
            lastName length should not be greater than 39
        emailAddress:
          type: string
          example: johnwick@gmail.com
          pattern: '([a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3})+'
          description: Email address of the user
        contactInfo:
          $ref: '#/components/schemas/ContactMethod'
        birthDate:
          type: string
          format: date
          example: '2023-10-31'
          description: 'Date of birth of the user, and format is yyyy-MM-dd'
        channelType:
          type: string
          example: TPV_API
          description: Channel type and it should be set to TPV_API
        loginId:
          type: string
          minLength: 6
          maxLength: 32
          example: lockeduser03
          description: Login id of the user
        password:
          type: string
          minLength: 6
          maxLength: 32
          example: test@123
          description: Password of the user
        acceptedDisclosure:
          type: boolean
          example: true
          description: Should be set to false
        userType:
          type: string
          enum:
            - RETAIL
            - BUSINESS
          example: RETAIL
          description: Type of the user
        userRole:
          type: string
          enum:
            - PRIMARY
            - ENTITLED
          example: PRIMARY
          description: User role
        ssn:
          type: string
          pattern: '([0-9]{9})'
          minLength: 9
          maxLength: 9
          example: 123456323
          description: SSN number of the user
        motherMaidenName:
          type: string
          example: abcd
          description: Mother's maiden name
        hostPassword:
          type: string
          minLength: 4
          maxLength: 32
          example: 1234
          description: ARS user PIN on HOST
        postalAddress:
          $ref: '#/components/schemas/PostalAddress1'
