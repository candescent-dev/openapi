    AccountEntitledFeature:
      description: >
        Represents account-level entitled features associated with Tax
        Identification Numbers (TINs). This object encapsulates the relationship
        between business locations (identified by TINs) and their entitled bank
        accounts with specific feature access permissions.
      example:
        entitledTins:
          - bankAccounts:
              - accountNumber: '323828838'
                features:
                  - ACH Payments
                  - ACH Collections
            featureLimits:
              - featureName: ACH Payments
                limits:
                  dailyLimits: 200000
                  perTransactionLimits: 50000
            memberNumber: '7838939999'
            tinNumber: '123456789'
      properties:
        entitledTins:
          description: >
            List of entitled TINs with their associated bank accounts and
            feature permissions. Each TIN represents a business location with
            its own set of entitled accounts.
          example:
            - bankAccounts:
                - accountNumber: '323828838'
                  features:
                    - ACH Payments
                    - ACH Collections
              featureLimits:
                - featureName: ACH Payments
                  limits:
                    dailyLimits: 200000
                    perTransactionLimits: 50000
              memberNumber: '7838939999'
              tinNumber: '123456789'
          items:
            $ref: '#/components/schemas/EntitledTins'
          type: array
      readOnly: true
      required:
        - entitledTins
      title: Account Entitled Feature
      type: object
    BankAccount:
      description: >
        Represents a bank account with its account number and associated
        features
      properties:
        accountNumber:
          description: The bank account number
          example: '123456789'
          type: string
        features:
          description: List of features or entitlements enabled for this bank account
          example:
            - ACH Payments
            - ACH Collections
          items:
            description: List of features or entitlements enabled for this bank account
            example: '["ACH Payments","ACH Collections"]'
            type: string
          type: array
      required:
        - accountNumber
      type: object
    BusinessEntitlementsLimits:
      description: >
        Represents the entitlements and associated limits for a business.
        Contains feature-level entitlements with transaction limits and
        account-level entitlements organized by business TINs.
      example:
        accountEntitledFeature:
          entitledTins:
            - bankAccounts:
                - accountNumber: '323828838'
                  features:
                    - ACH Payments
                    - ACH Collections
              memberNumber: '7838939999'
              tinNumber: '732832880'
        entitledFeatures:
          - featureName: ACH Payments
            limits:
              dailyLimits: 1000000
              monthlyLimits: 500000000001.89
              perTransactionLimits: 1000000
          - featureName: ACH Collections
            limits:
              dailyLimits: 1000000
              perTransactionLimits: 1000000
          - featureName: Wires - Domestic
            limits:
              dailyLimits: 1000000
              perTransactionLimits: 1000000
        secCodes:
          - ACH Payments Consumer (PPD)
          - ACH Payments Commercial (CCD)
      properties:
        accountEntitledFeature:
          $ref: '#/components/schemas/AccountEntitledFeature'
          description: >
            Account-level entitled features organized by business location,
            including TIN numbers and associated bank accounts
          example:
            entitledTins:
              - bankAccounts:
                  - accountNumber: '323828838'
                    features:
                      - ACH Payments
                      - ACH Collections
                memberNumber: '7838939999'
                tinNumber: '732832880'
          readOnly: true
        entitledFeatures:
          description: >
            List of entitled features with their associated transaction limits
            for the business
          example:
            - featureName: ACH Payments
              limits:
                dailyLimits: 1000000
                perTransactionLimits: 10000
          items:
            $ref: '#/components/schemas/EntitledFeature'
          type: array
        secCodes:
          description: List of SEC codes available for ACH transactions
          example:
            - ACH Payments Consumer (PPD)
            - ACH Payments Commercial (CCD)
          items:
            description: List of SEC codes available for ACH transactions
            example: '["ACH Payments Consumer (PPD)","ACH Payments Commercial (CCD)"]'
            type: string
          type: array
      readOnly: true
      required:
        - entitledFeatures
      title: BusinessEntitlementsLimits
      type: object
    EntitledFeature:
      description: Represents an entitled feature with its associated limits
      example:
        featureName: ACH Payments
        limits:
          dailyLimits: 1000000
          monthlyLimits: 500000000001.89
          perTransactionLimits: 1000000
      properties:
        featureName:
          description: Name of the entitled feature
          example: ACH Payments
          type: string
        limits:
          $ref: '#/components/schemas/FeatureLimits'
          description: Transaction limits associated with the feature
          example:
            dailyLimits: 50000
            monthlyLimits: 500000
            perTransactionLimits: 10000
          readOnly: true
      required:
        - featureName
      type: object
    EntitledTins:
      description: >
        Represents Entitled TINs with its associated TIN, member number, and
        bank accounts
      example:
        bankAccounts:
          - accountNumber: '323828838'
            features:
              - ACH Payments
              - ACH Collections
        featureLimits:
          - featureName: ACH Payments
            limits:
              dailyLimits: 200000
              perTransactionLimits: 50000
        memberNumber: '7838939999'
        tinNumber: '123456789'
      properties:
        bankAccounts:
          description: List of bank accounts associated with this business location
          example:
            - accountNumber: '323828838'
              features:
                - ACH Payments
                - ACH Collections
          items:
            $ref: '#/components/schemas/BankAccount'
          type: array
        featureLimits:
          description: >
            List of entitled features with their associated transaction limits
            for the business at tin level
          example:
            - featureName: ACH Payments
              limits:
                dailyLimits: 200000
                perTransactionLimits: 50000
          items:
            $ref: '#/components/schemas/EntitledFeature'
          type: array
        memberNumber:
          description: Member number associated with the business location
          example: '874387789'
          type: string
        tinNumber:
          description: Tax Identification Number (TIN) of the business location
          example: '123456789'
          type: string
      required:
        - bankAccounts
        - tinNumber
      type: object
    ErrorInfo5:
      description: Error information containing error code and descriptive message
      example:
        code: BBE-41109
        message: Invalid roles or entitlements
      properties:
        code:
          description: Error code identifying the type of error
          example: BBE-41109
          type: string
        message:
          description: Human-readable error message describing the error
          example: Invalid roles or entitlements
          type: string
      required:
        - code
        - message
      type: object
    FeatureLimits:
      description: Represents the transaction limits associated with a feature
      example:
        dailyLimits: 50000
        dailyOverallAchLimits: 100000
        dailyOverallWiresLimits: 100000
        monthlyLimits: 500000
        perTransactionApprovalThresholdLimits: 500
        perTransactionLimits: 10000
      properties:
        dailyLimits:
          description: Maximum cumulative limit allowed per day
          example: 50000
          type: number
        dailyOverallAchLimits:
          description: Maximum cumulative limit for all ACH types allowed per day
          example: 100000
          type: number
        dailyOverallWiresLimits:
          description: Maximum cumulative limit for all wire types allowed per day
          example: 100000
          type: number
        monthlyLimits:
          description: Maximum cumulative limit allowed per month
          example: 500000
          type: number
        perTransactionApprovalThresholdLimits:
          description: Limit per transaction above which approval is required
          example: 500
          type: number
        perTransactionLimits:
          description: Maximum limit allowed per single transaction
          example: 10000
          type: number
      readOnly: true
      required:
        - perTransactionLimits
      title: FeatureLimits
      type: object
    UserEntitlementsLimits:
      description: >
        Represents the entitlements and associated limits for a user. Contains
        feature-level entitlements with transaction limits and account-level
        entitlements organized by business location.
      example:
        accountEntitledFeature:
          entitledTins:
            - bankAccounts:
                - accountNumber: '323828838'
                  features:
                    - Create Ad Hoc ACH Collections
                    - Create ACH Collections using Templates
                    - Approve ACH Collections
                    - Create Ad Hoc ACH Payments
                    - Create ACH Payments using Templates
                    - Approve ACH Payments
                    - Create ACH File Pass-Through
                    - Approve ACH File Pass-Through
              memberNumber: '4738374839'
              tinNumber: '123456789'
        entitledFeatures:
          - featureName: Approve ACH Payments
            limits:
              perTransactionLimits: 1000000
          - featureName: Create Ad Hoc ACH Collections
            limits:
              dailyLimits: 1000000
              monthlyLimits: 500000000001.89
              perTransactionApprovalThresholdLimits: 1
              perTransactionLimits: 1000000
          - featureName: Create ACH Collections using Templates
            limits:
              dailyLimits: 1000000
              monthlyLimits: 500000000001.89
              perTransactionApprovalThresholdLimits: 1
              perTransactionLimits: 1000000
          - featureName: Approve ACH Collections
            limits:
              perTransactionLimits: 1000000
          - featureName: Approve ACH Templates
          - featureName: Manage ACH Templates
          - featureName: Create Ad Hoc ACH Payments
            limits:
              dailyLimits: 1000000
              monthlyLimits: 500000000001.89
              perTransactionApprovalThresholdLimits: 1
              perTransactionLimits: 1000000
          - featureName: Create ACH Payments using Templates
            limits:
              dailyLimits: 1000000
              monthlyLimits: 500000000001.89
              perTransactionApprovalThresholdLimits: 1
              perTransactionLimits: 1000000
          - featureName: Create ACH File Pass-Through
            limits:
              dailyLimits: 3000000
              monthlyLimits: 500000000001.89
              perTransactionApprovalThresholdLimits: 1
              perTransactionLimits: 3000000
          - featureName: Approve ACH File Pass-Through
            limits:
              perTransactionLimits: 1
          - featureName: Manage ACH Blocks and Filters
          - featureName: Decision ACH Positive Pay Exceptions
          - featureName: ACH File Import - Manage Import File Definitions
          - featureName: ACH File Import - Import Recipient Information
          - featureName: Bill Pay
        secCodes:
          - ACH Payments Consumer (PPD)
          - ACH Payments Payroll (PPD)
          - ACH Payments Commercial (CCD)
          - ACH Collections Consumer (PPD)
          - ACH Collections Commercial (CCD)
      properties:
        accountEntitledFeature:
          $ref: '#/components/schemas/AccountEntitledFeature'
          description: >
            Account-level entitled features organized by business location,
            including TIN numbers and associated bank accounts
          example:
            entitledTins:
              - bankAccounts:
                  - accountNumber: '323828838'
                    features:
                      - Create Ad Hoc ACH Collections
                      - Approve ACH Payments
                memberNumber: '4738374839'
                tinNumber: '123456789'
          readOnly: true
        entitledFeatures:
          description: >
            List of entitled features with their associated transaction limits
            for the user
          example:
            - featureName: Approve ACH Payments
              limits:
                perTransactionLimits: 1000000
          items:
            $ref: '#/components/schemas/EntitledFeature'
          type: array
        secCodes:
          description: List of SEC codes available for ACH transactions
          example:
            - ACH Payments Consumer (PPD)
            - ACH Collections Commercial (CCD)
          items:
            description: List of SEC codes available for ACH transactions
            example: '["ACH Payments Consumer (PPD)","ACH Collections Commercial (CCD)"]'
            type: string
          type: array
      required:
        - entitledFeatures
      type: object
