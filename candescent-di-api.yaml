info:
  title: Candescent DI API
  version: 1.3.1
  description: >
    Welcome to the **Candescent Digital Insight API** documentation. This
    comprehensive API platform enables financial institutions, Marketplace
    Partners, and developers to build powerful digital banking experiences.


    ## Getting Started


    New to the Candescent API? Start here:


    - **[Quick Start Guide](/guides/getting-started/quickstart/)** - Make your
    first API call in minutes

    - **[API Categories Overview](/guides/getting-started/api-overview/)** -
    Explore all available API categories

    - **[Error Codes Reference](/guides/getting-started/error-codes/)** - Handle
    errors effectively


    ## API Categories


    | Category | Description |

    |----------|-------------|

    | **[Accounts](/api/generated/accounts/)** | Account information,
    transactions, and banking images |

    | **[Alert Configuration](/api/generated/alert-configuration/)** | Alert
    types and templates |

    | **[Alert Delivery](/api/generated/alert-delivery/)** | Alert delivery
    history |

    | **[Alert Preferences](/api/generated/alert-preferences/)** | End-user
    notification preferences |

    | **[Authentication](/api/generated/authentication/)** | OAuth 2.0 token
    management and authorization |

    | **[Business Banking](/api/generated/business-banking/)** | Business
    banking services |

    | **[Customer Campaigns](/api/generated/customer-campaigns/)** | User
    segmentation and promotions |

    | **[Customer Management](/api/generated/customer-management/)** | Customer
    profiles, registration, and self-service |

    | **[Documents and Preferences](/api/generated/documents-and-preferences/)**
    | Disclosures and e-statement preferences |

    | **[Money Movement](/api/generated/money-movement/)** | Recipients and fund
    transfers |

    | **[MX](/api/generated/mx/)** | Account aggregation and financial insights
    |

    | **[Notification Channels](/api/generated/notification-channels/)** |
    Notification channels for alert delivery |


    ## Base URLs


    | Environment | Base URL |

    |-------------|----------|

    | Stage       | `https://api.candescent.com/digitalbanking/stage` |

    | Production  | `https://api.candescent.com/digitalbanking` |


    > **Note:** This documentation primarily references the **Stage**
    environment for examples.


    ## Authentication Overview


    Candescent APIs use OAuth 2.0 with JWT Bearer tokens. Follow these steps:


    ### Step 1: Obtain Client Credentials

    Get your `Client ID` and `Client Secret` from the Candescent Developer
    Console.


    ### Step 2: Generate an Access Token


    ```bash

    curl -X POST
    'https://api.candescent.com/digitalbanking/stage/oauth2/v1/token' \
      -H 'Authorization: Basic <BASE64_ENCODED(CLIENT_ID:CLIENT_SECRET)>' \
      -H 'Content-Type: application/x-www-form-urlencoded' \
      -H 'transactionid: <YOUR_UNIQUE_UUID>' \
      -H 'institutionId: <YOUR_INSTITUTION_ID>' \
      -d 'grant_type=client_credentials'
    ```


    ### Step 3: Make Authenticated Requests


    Include the token in the `Authorization` header:


    ```bash

    curl 'https://api.candescent.com/digitalbanking/stage/accounts/v1/accounts'
    \
      -H 'Authorization: Bearer <YOUR_ACCESS_TOKEN>' \
      -H 'institutionId: <YOUR_INSTITUTION_ID>' \
      -H 'transactionid: <YOUR_UNIQUE_UUID>'
    ```


    > **Tip:** Access tokens expire in ~1 hour. Implement token refresh logic
    for uninterrupted access.


    For detailed authentication flows, see the **[Authentication API
    Reference](/api/generated/authentication/)**.
servers:
  - url: 'https://{host}/digitalbanking/stage'
    variables:
      host:
        default: api.candescent.com
        description: host for the environment you are using
security:
  - BearerAuth: []
tags:
  - name: Accounts
    description: >
      The **Accounts** API provides comprehensive services for retrieving and
      managing customer account information, 

      transaction history, and associated document images.


      An *account* represents a contract between a customer and a financial
      institution. A customer opens an account 

      with a bank or credit union (such as a checking, savings, loan, or line of
      credit account) and enters into 

      a contractual relationship with the FI.


      ## End-User Benefits

      - Check account status and balance in real-time

      - Review posted transactions including checks and deposits

      - Access transaction history with date range filtering

      - View digitized check images, deposit slips, and statements

      - Identify and report fraudulent or inaccurate transactions


      ## Integration Capabilities

      - Retrieve account data with ODATA filtering by category

      - Query transaction history with configurable date ranges

      - Access check, deposit slip, and statement images

      - Support Business Banking with location-based account grouping

      - Enable balance-based alerting and cross-sell identification


      ## Key Capabilities


      ### Account Information

      - Returns **Cross Accounts** by default

      - Supports **ODATA filtering** by account category (DEPOSIT, LOAN,
      INVESTMENT, TIERED_LOAN, CROSS_USER_ACCOUNT)

      - Retrieve accounts for **intra-FI transfer recipients**

      - **Business Banking** support with location-based account grouping


      ### Transaction History

      - Retrieve transaction records from FI host systems for any account

      - Filter by date range (startDate, endDate parameters)

      - Retrieve pending/future transactions

      - Image identifiers for check/deposit slip retrieval

      - Running balance calculation (configurable)


      ### Banking Images

      - Retrieve digitized CHECK, DEPOSIT_SLIP, and STATEMENT images

      - Get image list filtered by account, type, and date range

      - Download individual images by identifier

      - Statement preview (vendor-dependent)


      ## Transaction Types


      Transactions are categorized into various types including:

      - **Debits**: WITHDRAWAL, CHECK, ATM_WITHDRAWAL, POS_PURCHASE,
      BILL_PAYMENT, TRANSFER_DEBIT

      - **Credits**: DEPOSIT, DIRECT_DEPOSIT, ATM_DEPOSIT, TRANSFER_CREDIT,
      PAYMENT, DIVIDEND

      - **Fees**: SERVICE_CHARGE, ATM_FEE, INSUFFICIENT_FUNDS_CHARGE,
      OVERDRAFT_FEE, LATE_PAYMENT_FEE

      - **Adjustments**: LEDGER_ADJUSTMENT_DEBIT, LEDGER_ADJUSTMENT_CREDIT,
      DEBIT_ADJUSTMENT, CREDIT_ADJUSTMENT


      ## Business Banking Users

      Business Banking users must include the `institutionCustomerId` parameter
      to provide business context. 

      Use the Institution User API to lookup the business entity ID first.


      ## Common Error Codes


      ### Account Errors (ACC)


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | ACC_00002 | Given password is invalid | 401 |

      | ACC_00005 | Error processing filter expression | 400 |

      | ACC_00011 | Validation Error | 400 |

      | ACC_00012 | Data not found | 404 |

      | ACC_00101 | User not found | 404 |

      | ACC_00113 | Update nickname feature is not enabled | 403 |

      | ACC_00114 | Nickname field should not be empty | 400 |

      | ACC_00115 | Nick name update is disabled for Joint Accounts | 403 |

      | ACC_00116 | NickName length exceeds configured maximum | 400 |

      | ACC_00408 | BB User is missing User Id in the request | 400 |

      | ACC_00409 | Invalid User Type Header for Business Banking User | 400 |

      | ACC_00410 | A location is required for BB users | 400 |

      | ACC_00600 | ServiceType parameter is invalid. Valid values are IB/BB |
      400 |

      | ACC_00601 | Invalid JWT token | 400 |

      | ACC_00602 | Unauthorized access | 401 |

      | ACC_99992 | One or more request query params are invalid or not provided
      | 400 |

      | ACC_99994 | Invalid query param | 400 |

      | ACC_99995 | Request should only contain printable ASCII characters | 400
      |

      | ACC_99998 | Request is missing a transactionId header | 400 |


      ### Transaction Errors (TXN)


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | TXN_10001 | The date(s) provided could not be parsed, or represented an
      invalid range | 400 |

      | TXN_10003 | Request should only contain printable ASCII characters | 400
      |

      | TXN_10005 | Invalid query param | 400 |

      | TXN_10006 | A valid institution customer id is required for business
      users | 400 |

      | TXN_10007 | A valid account id is required | 400 |

      | TXN_11001 | Full authentication was not provided in the request | 401 |

      | TXN_11002 | The authentication token is invalid | 401 |

      | TXN_11003 | The authentication does not authorize this request | 403 |

      | TXN_20001 | Transaction history is not enabled for this account | 400 |

      | TXN_20002 | This user is not entitled to see transaction history | 400 |

      | TXN_99999 | Server error | 500 |


      ### Banking Image Errors (BIS)


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | BIS_00004 | Image type cannot be null or empty | 400 |

      | BIS_00005 | Image type is not supported (must be CHECK, DEPOSIT_SLIP, or
      STATEMENT) | 400 |

      | BIS_00006 | Account type is not supported for check image | 400 |

      | BIS_00009 | Transaction image number is invalid | 400 |

      | BIS_00011 | Account ID cannot be null or empty | 400 |

      | BIS_00018 | Start/end date required for statements | 400 |

      | BIS_00019 | Start date cannot be after end date | 400 |

      | BIS_00020 | Location required for BB users | 400 |

      | BIS_10001 | Full authentication not provided | 401 |

      | BIS_10002 | Authentication token is invalid | 401 |

      | BIS_10003 | Authentication does not authorize request | 403 |

      | BIS_30004 | No data found | 404 |

      | BIS_99999 | Server error | 500 |


      ## Endpoints
  - name: Alert Configuration
    description: >
      The Alert Configuration API enables Financial Institutions to set up and
      manage alert types and templates. These define what alerts are available
      to customers and how alert messages are formatted across different
      channels.


      ## Integration Capabilities

      - Define available alert types (Low Balance, High Balance, Large
      Transaction, etc.)

      - Configure alert message templates with dynamic variable substitution

      - Manage alert settings across multiple channels (Email, SMS, Push, Web)

      - Set up institution-specific channel enablement and customizations


      ## Alert Types

      Alert types define the categories of alerts available to customers. They
      can be configured at:

      - **External System level**: System-wide alert type definitions

      - **Institution level**: FI-specific customizations and channel enablement


      ## Alert Templates

      Templates define the content of alerts by channel. Supports variable
      substitution using a `variableMap` for dynamic content like account
      numbers, balances, and transaction amounts.


      ## Supported Channels


      | Channel | Description |

      |---------|-------------|

      | EMAIL | Email notifications with subject and body |

      | SMS | Text message notifications |

      | PUSH | Mobile push notifications |

      | WEB | Web-based notifications |


      ## Template Content Types


      | Content Type | Description |

      |--------------|-------------|

      | EMAIL_SUBJECT | Email subject line |

      | EMAIL_BODY | Email body content |

      | SMS_BODY | SMS message content |

      | PUSH_BODY | Push notification content |

      | WEB_BODY | Web notification content |


      ## Common Error Codes


      ### System Errors (PRMSYS)

      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | PRMSYS_10001 | Cross talk / concurrency error occurred | 400 |

      | PRMSYS_10002 | Malformed input data | 400 |

      | PRMSYS_10003 | Unknown application error occurred | 400 |

      | PRMSYS_10004 | Error occurred while validating JWT token | 400 |

      | PRMSYS_10005 | Resource of name already exists | 204 |

      | PRMSYS_10006 | Requested resource of identifier doesn't exist | 400 |

      | PRMSYS_10007 | Resource of identifier already exists | 400 |

      | PRMSYS_10008 | Requested resource of name doesn't exist | 400 |

      | PRMSYS_10015 | Required attribute missing | 400 |

      | PRMSYS_10016 | Non Printable ASCII character detected | 400 |


      ### Validation Errors (PRMVAL)

      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | PRMVAL_10001 | Path parameter doesn't match request body value | 400 |

      | PRMVAL_10002 | Invalid value for field | 400 |

      | PRMVAL_10003 | Invalid institution | 400 |

      | PRMVAL_10005 | Invalid channel type | 400 |

      | PRMVAL_10006 | Invalid alert type | 400 |

      | PRMVAL_10007 | Field is required | 400 |

      | PRMVAL_10008 | Field is invalid | 400 |


      ## Endpoints
  - name: Alert Delivery
    description: >
      The Alert Delivery API enables publishing alert events and retrieving
      alert history. This is the bridge between events occurring in the system
      and alerts being sent to customers.


      ## End-User Benefits

      - Receive proactive notifications about account activity

      - Stay informed about important financial events in real-time


      ## Integration Capabilities

      - Publish account, transaction, and notification events

      - Retrieve alert history with filtering by account, date, and status

      - Track alert delivery across Email, SMS, and Push channels


      ## Event Types


      The Alert Events API supports three event types:


      | Event Type | Description |

      |------------|-------------|

      | **AccountEvent** | Account-related events (balance changes, status
      updates) |

      | **TransactionEvent** | Transaction-related events (deposits,
      withdrawals, transfers) |

      | **NotificationEvent** | General notification events |


      ## Alert History


      Retrieve published alerts using various filter parameters:

      - Filter by account IDs

      - Filter by date range (startDate, endDate)

      - Filter by alert type names

      - Filter by delivery status (EMAIL, SMS, PUSH)

      - Filter by read/unread status


      ## Common Error Codes


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | PRMSYS_10003 | Unknown application error occurred | 400 |

      | PRMSYS_10004 | Error occurred while validating JWT token | 400 |

      | PRMSYS_10009 | Resource doesn't exist for the provided search criteria |
      500 |

      | PRMSYS_10011 | Unauthorized access to the resource | 404 |

      | PRMSYS_10012 | Unauthorized access - JWT value mismatch | 404 |

      | PRMVAL_10014 | Invalid date format | 400 |


      ## Endpoints
  - name: Alert Preferences
    description: >
      The Alert Preferences API enables customers to set personalized alert
      thresholds and notification preferences. Preferences link alert types to
      specific accounts or cards with user-defined conditions.


      ## End-User Benefits

      - Set personalized alert thresholds (e.g., "Alert me when balance is below
      $100")

      - Choose preferred notification channels (SMS, Email, Push)

      - Manage alerts for specific accounts or cards


      ## Integration Capabilities

      - Create, retrieve, and update end-user alert preferences

      - Configure institution-level default preferences

      - Link alert types to accounts with custom threshold values


      ## User vs Institution Preferences


      | Type | Description |

      |------|-------------|

      | **User Preferences** | Customer-specific alert settings for their
      accounts |

      | **Institution Preferences** | Default preferences set by the FI for all
      customers |


      If user-specific preferences are not found, institution-level defaults are
      returned.


      ## Common Error Codes


      ### Alert Preference Errors (PRMAPS)

      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | PRMAPS_10007 | Invalid alert preference ID | 404 |

      | PRMAPS_10008 | Alert preference mismatch | 400 |


      ### Validation Errors (PRMVAL)

      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | PRMVAL_10004 | Invalid user | 400 |

      | PRMVAL_10006 | Invalid alert type | 400 |

      | PRMVAL_10009 | Requested alert type was not found for the FI | 400 |

      | PRMVAL_10010 | Preference not found for enrollmentId | 400 |

      | PRMVAL_10011 | Preference not found for institution | 400 |

      | PRMVAL_10012 | Value should not be null | 400 |

      | PRMVAL_10013 | Invalid alert preference | 400 |

      | PRMVAL_10015 | Alert type not configured for channel or disabled for
      Institution | 400 |

      | PRMVAL_10016 | Unsupported account type | 400 |


      ## Endpoints
  - name: Notification Channels
    description: >
      The Notification Channels API manages customer notification destinations
      and event subscriptions. This enables customers to receive alerts through
      their preferred communication channels.


      **Note:** These endpoints require a **V1 OAuth token**. See Authentication
      documentation for V1 token endpoint details.


      ## End-User Benefits

      - Register and manage notification destinations (phone, email)

      - Subscribe to specific event types

      - Control how and where they receive notifications


      ## Integration Capabilities

      - Manage end-user notification destinations programmatically

      - Create and manage event subscriptions per user or institution

      - Send events to subscribed end-users


      ## Destinations


      Destinations represent the contact methods where customers receive
      notifications:

      - Phone numbers for SMS/Voice

      - Email addresses

      - Device tokens for Push notifications


      Destinations are associated with specific products and notification
      applications.


      ## Subscriptions


      Subscriptions define which events a customer wants to receive
      notifications for:

      - Subscribe to specific event types

      - Configure subscription settings

      - Manage subscriptions at user or institution level


      ## Common Error Codes


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | 400 | Missing Required HTTP Headers or Invalid/Missing Inputs | 400 |

      | 401 | Authorization invalid or Missing Authorization Header | 401 |

      | 404 | Entities not Found (User or Account not found) | 404 |

      | 500 | Internal Server Error | 500 |


      ## Endpoints
  - name: Authentication
    description: >
      The Authentication API is a core service in the **Candescent Developer
      Experience Portal (DevEx)**, providing secure access to other APIs via
      **OAuth 2.0 access tokens**. These tokens authenticate and authorize
      requests to protected resources. All Candescent APIs require a valid
      access token in the Authorization header.


      ## Token Versions

      Candescent APIs use two versions of OAuth tokens:

      - **V1 tokens**: Used by legacy endpoints such as Send Event,
      Destinations, Get FI Customer, and Register User.

      - **V2 tokens**: Used by most current endpoints including Accounts,
      Alerts, Banking Images, Disclosures, Money Movement, and Transactions.


      ## Key Capabilities

      - **Client Credentials**: Institution-level, server-to-server access.

      - **Password**: User-level access with credentials.

      - **Authorization Code**: Generate auth codes for OAuth flows; authorize
      client applications with scope-based access control.

      - **Refresh Token**: Renew expired tokens.

      - **Token Revocation**: Invalidate tokens during logout or security
      events.


      Tokens include scopes and expiration to ensure secure, time-bound access.


      ## Usage Scenarios

      - Authenticate before accessing other DevEx APIs.

      - Use Client Credentials for institution-level access.

      - Use Password for first-party apps with direct user authentication.

      - Refresh tokens without re-authentication.

      - Revoke tokens during logout or security incidents.


      ## Requirements

      Register with a valid `client_id` and `client_secret`.


      ## Required Headers

      | Header | Description |

      |--------|-------------|

      | Authorization | Basic Auth - Base64 encoded client credentials
      (shared_key:secret_key) |

      | Content-Type | Request content type (application/x-www-form-urlencoded)
      |

      | transactionId | A unique identifier for this request (UUID format) |

      | institutionId | Numeric unique ID of the financial institution |


      ## Authentication Flows

      These flows support both Retail and Business users. Business flows
      identify the business entity.


      ### Business User Setup

      1. Lookup business entity ID: `GET
      /db-users/v1/institution-users/{{login_id_bb}}?userIdType=LOGIN_ID`

      2. Extract `institutionCustomerId` from the list of `institutionCustomers`
      - Match the correct `memberNumber` (TIN/EIN) and extract the corresponding
      `institutionCustomerId`.

      3. Use in API Calls - Include `institutionCustomerId` as a query parameter
      in subsequent requests to provide business context.


      ### 1. Client Credentials Grant

      Use for server-to-server (institution-level) authentication. Subsequent
      calls require user context.

      - **Retail:** Pass `hostUserId` or `loginId` as query parameter.

      - **Business:** Pass `loginId` as query parameter.


      ### 2. Password Grant

      Used for direct user authentication with credentials.


      ### 3. Token Refresh

      Only applicable if the original token was issued via Password Grant.


      ### 4. Token Revocation

      Used to invalidate an existing access token.


      ## Error Codes

      | Error Code | Error Message | HTTP Status Code |

      |------------|---------------|------------------|

      | CMN_90000 | Internal server error | 500 |

      | CMN_90001 | Internal server error - Cross Talk | 500 |

      | CMN_90002 | Quota limit violation | 500 |

      | CMN_90003 | Spike limit violation | 500 |

      | CMN_90004 | Invalid client credentials | 401 |

      | CMN_90005 | Header institutionId is invalid or Form param
      institution_user_id is invalid | 400 |

      | CMN_90006 | Not authorized to access this resource | 400 |

      | CMN_90007 | Invalid grant type | 400 |

      | CMN_90008 | Header transactionId is invalid | 400 |

      | CMN_90009 | Access blocked | 400 |

      | CMN_90010 | Header is invalid | 400 |

      | CMN_90011 | Request is invalid | 400 |

      | CMN_90012 | Request is invalid - Scopes | 400 |

      | CMN_90013 | Username is invalid | 400 |

      | CMN_90014 | Password is invalid | 400 |

      | CMN_90015 | Invalid user credentials | 401 |

      | CMN_90016 | Invalid user | 400 |

      | CMN_90017 | Request contains non printable ASCII characters | 400 |

      | CMN_90018 | Invalid token | 401 |

      | CMN_90019 | Error creating token | 500 |

      | CMN_90020 | App cannot authorize itself | 400 |

      | CMN_90021 | Invalid client configuration | 400 |


      ## Endpoints
  - name: Customer Management
    description: >
      The Customer Management APIs provide comprehensive services for managing
      digital banking customer information, including profile retrieval,
      customer registration, and self-service capabilities. These APIs
      facilitate relationship management between Financial Institutions and
      their customers.


      ## Prerequisites

      Before utilizing the Customer Management APIs, ensure:

      - The customer is registered with the financial institution

      - The correct user ID is linked to the system


      ## End-User Benefits

      - Register for online banking with a streamlined signup process

      - Review and acknowledge terms and legal agreements during enrollment

      - Keep digital banking profile information up-to-date

      - Reset password via self-service using preferred contact method


      ## Integration Capabilities

      - Register new end-users with comprehensive validation and error handling

      - Retrieve customer profile, contact, status, and credential data

      - Implement self-service password reset with OTP delivery

      - Support multiple customer ID types (GUID, Member Number, Login ID, Host
      ID)


      ## What is Supported


      ### Customer Profile Retrieval

      - **Contact info**: Name, phone number, email address, postal addresses

      - **User credentials**: Login ID, Member Number, Host Login ID

      - **User status**: Active, On Hold, Locked, Reset, Registered, etc.

      - **User Products**: Digital Banking, Mobile, Bill Pay

      - **Channel information**: Web, Mobile, PFM login details


      ### Customer Registration

      The Registration API provides third-party application developers with
      access to the same registration process used in Candescent Digital
      Banking. **No scope required.**


      **Common Use Cases:**

      - Online banking vendors registering users for additional offerings after
      account opening

      - Mobile banking vendors providing products to FIs using Candescent
      Digital Banking

      - Application developers extending Candescent Digital Banking
      functionality


      **Required Personal Data:**

      - First name, Last name, Middle name (optional)

      - Social Security Number (9 digits)

      - Date of Birth (yyyy-mm-dd format)

      - Address: Street, City, State, Zip Code, Country

      - Phone Number (10 digits)

      - Email Address

      - Mother's Maiden Name


      **Username Policy:**

      - Default: 8-20 characters (configurable: min 6, max 20)

      - Cannot be only numbers, can be all letters

      - Allowed special characters: `@$*_-=.!~`

      - No spaces allowed


      **Password Policy:**

      - Length: 6-32 characters (configurable within limits)

      - Must contain characters from at least 2 of: Letters, Numbers, Special
      characters

      - No spaces allowed

      - Cannot be a substring of the username


      ### Reset Password (Self-Service)

      The Reset Password API enables customers to reset their password using a
      one-time passcode sent to their preferred contact method.


      **What is Supported:**

      - Verify that a customer exists at a specified financial institution

      - Provide a list of contact methods (SMS, Voice, Email) for the customer

      - Send a one-time passcode to the customer's desired contact method


      **Required Scopes:**

      | Scope | Permission |

      |-------|------------|

      | `institution-users:read` | Get and find contact methods for a customer |

      | `institution-users:write` | Trigger sending of one-time passcode |


      **Reset Password Flow:**

      1. **Retrieve Contact Methods**: `GET
      /ux-users/v1/customers/{customerId}/contactMethods`
         - Returns available destinations (SMS, Voice, Email) with masked contact info
         - See endpoint documentation for response example
      2. **Customer Selects Destination**: Choose where to receive the OTP

      3. **Initiate Reset**: `PUT
      /ux-users/v1/customers/{customerId}:resetPassword`
         - Send `destinationId` in the request body
         - OTP is sent to the selected contact method

      ## Customer ID Types

      The `fiCustomerIdType` parameter supports multiple identifier types:


      | Type | Description |

      |------|-------------|

      | GUID | Internal ID (default) |

      | MEMNUMBER | Financial institution's core system ID |

      | LOGINID | Customer's digital banking login ID |

      | HOSTID | Host system identifier |


      ## Common Error Codes


      ### Banking Services Errors

      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | USER_ERROR | Bad Request - Invalid fiCustomerIdType | 400 |

      | APP_ERROR | Unauthorized Access | 401 |

      | APP_ERROR | FICustomer does not exist | 404 |

      | SYSTEM_ERROR | Internal server error | 500 |

      | SYSTEM_ERROR | Circuit breaker open or throttle limit reached | 503 |


      ### Registration Errors (V4 Endpoint)

      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | 20006 | Invalid input (member number, channel info, name length, SSN
      missing) | 400 |

      | 26201 | LoginID is already taken | 400 |

      | 26214 | Too many destinations passed | 400 |

      | 26330 | Registration already in progress (duplicate request) | 409 |

      | 26331 | User is already registered | 409 |

      | 26340 | Could not create record in database | 400 |

      | 220001 | SSN is not 9 digits | 400 |

      | 220002 | First name exceeds 39 characters | 400 |

      | 220003 | Last name exceeds 39 characters | 400 |

      | 220005 | Middle name exceeds 39 characters | 400 |

      | 220006 | Email exceeds 64 characters | 400 |

      | 220007 | Postal code not found | 400 |

      | 220008 | City not found | 400 |

      | 220009 | State not found or exceeds 128 chars (US requires 2 chars) |
      400 |

      | 220010 | Street/Address1 not found or exceeds 128 chars | 400 |

      | 220011 | Country not found | 400 |

      | 220012 | Mother's maiden name not found or exceeds 128 chars | 400 |

      | 220013 | Invalid date of birth format | 400 |

      | 220014 | Phone number is missing | 400 |

      | 220015 | Invalid LoginID (must be 6-256 chars, no spaces, allowed:
      @$*_-=.!~) | 400 |

      | 220016 | LoginID cannot match member number | 400 |

      | 220018 | Invalid password | 400 |

      | 220019 | Login must be within preconfigured range | 400 |


      ### Customer Services Errors (V2 Token - UX Users)


      #### Authentication & Header Errors

      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | UXU_10001 | Invalid JWT token | 400 |

