  /db-bb-core/v1/business-details:
    get:
      description: >
        Retrieves comprehensive business details for a company or user based on
        the provided search criteria.


        **Search Types:**


        - `BUSINESS_ID`: Search by the unique business/company identifier

        - `LOGIN_ID`: Search by the user's login ID


        **Response includes:**


        - Business name and registration information

        - Business address details (street, city, state, zip)

        - Primary contact information

        - TIN details (optional, when `includeTins=true`)

        - Customer/user details (optional, when `includeUsers=true`)


        **Usage Notes:**


        - The `searchType` and `searchValue` parameters are required

        - Use `BUSINESS_ID` search type when you have the company's unique
        identifier

        - Use `LOGIN_ID` search type when searching by a user's credentials

        - Set `includeTins=true` to retrieve Tax Identification Number details

        - Set `includeUsers=true` to retrieve associated user/customer
        information
      operationId: getBusinessDetailsV1
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'OAuth 2.0 access token for authentication. Format: ''Bearer {token}'''
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: transactionId
          in: header
          required: true
          description: >-
            UUID used to trace and correlate requests across services for
            debugging and logging.
          schema:
            type: string
            format: uuid
            example: f8187c63-678f-4f0c-9263-46723794661a
        - description: >
            Specifies the type of search to perform. Determines how the
            searchValue parameter is interpreted.


            - **BUSINESS_ID**: Search using the unique business/company
            identifier assigned during registration

            - **LOGIN_ID**: Search using the user's login credentials (username)
          examples:
            SearchByBusinessId:
              description: Search using the company's unique identifier
              value: BUSINESS_ID
            SearchByLoginId:
              description: Search using the user's login credentials
              value: LOGIN_ID
          in: query
          name: searchType
          required: true
          schema:
            example: LOGIN_ID
            type: string
        - description: >
            The value to search for, based on the specified searchType.


            - When searchType is **BUSINESS_ID**: Provide the unique
            company/business identifier (e.g., "1234567890")

            - When searchType is **LOGIN_ID**: Provide the user's login ID
            (e.g., "johnsmith123")
          examples:
            BusinessIdExample:
              description: Unique business identifier
              value: '1234567890'
            LoginIdExample:
              description: User's login ID
              value: johnsmith123
          in: query
          name: searchValue
          required: true
          schema:
            example: johnsmith123
            type: string
        - description: >
            Flag to include Tax Identification Number (TIN) details in the
            response. When set to true, the response will include TIN
            information for each business location.
          examples:
            ExcludeTins:
              description: Exclude TIN details from response (default)
              value: false
            IncludeTins:
              description: Include TIN details in response
              value: true
          in: query
          name: includeTins
          required: false
          schema:
            default: false
            example: true
            type: boolean
        - description: >
            Flag to include additional customer/user details in the response.
            When set to true, the response will include information about users
            associated with the business.
          examples:
            ExcludeUsers:
              description: Exclude user details from response (default)
              value: false
            IncludeUsers:
              description: Include user details in response
              value: true
          in: query
          name: includeUsers
          required: false
          schema:
            default: false
            example: true
            type: boolean
      responses:
        '200':
          content:
            application/json:
              examples:
                SuccessfulResponse:
                  description: SuccessfulResponse
                  summary: SuccessfulResponse
                  value:
                    additionalInfo:
                      employeeCount: '500'
                      industry: Technology
                      yearEstablished: '2010'
                    billingAccountNumber: '123456789'
                    billingMiscellaneous: Monthly billing cycle
                    businessId: BUS123456
                    businessName: Acme Corporation
                    contact:
                      address:
                        address1: 123 Main Street
                        address2: Suite 400
                        city: San Francisco
                        state: CA
                        zipCode: '94105'
                      email: john.smith@acme.com
                      firstName: John
                      lastName: Smith
                      phoneNumber: 415-555-1234
                    institutionId: '04715'
                    status: ACTIVE
                    tins:
                      - memberNumber: '9749374838'
                        primary: true
                        tinName: Acme
                        tinNumber: '123456789'
                    users:
                      - contactMethods:
                          - contactInfo: john.smith@acme.com
                            enrolledDateTime: '2024-01-15T10:30:00Z'
                            protocol: EMAIL
                            telephoneCountryCode: '+1'
                        email: john.smith@acme.com
                        firstName: John
                        lastName: Smith
                        loginId: jsmith@acme.com
                        middleName: Michael
                        role: PRIMARY_ADMIN
                        status: ACTIVE
                        updatePending: false
              schema:
                $ref: '#/components/schemas/BusinessDetails'
          description: Business details retrieved successfully.
        '400':
          content:
            application/json:
              examples:
                InvalidInputParameters:
                  description: InvalidInputParameters
                  summary: InvalidInputParameters
                  value:
                    code: BBS-40095
                    message: 'Invalid searchType: Test'
              schema:
                $ref: '#/components/schemas/ErrorInfo4'
          description: |
            Bad Request - Invalid input parameters. Possible causes:

            - Invalid searchType
        '401':
          content:
            application/json:
              examples:
                InvalidJwt:
                  description: InvalidJwt
                  summary: InvalidJwt
                  value:
                    code: BBS-40150
                    message: Invalid JWT
              schema:
                $ref: '#/components/schemas/ErrorInfo4'
          description: Unauthorized - Authentication credentials are missing or invalid.
        '403':
          content:
            application/json:
              examples:
                InvalidRolesOrEntitlements:
                  description: InvalidRolesOrEntitlements
                  summary: InvalidRolesOrEntitlements
                  value:
                    code: BBS-40151
                    message: Invalid roles or entitlements
              schema:
                $ref: '#/components/schemas/ErrorInfo4'
          description: Unauthorized - Invalid roles or entitlements.
        '500':
          content:
            application/json:
              examples:
                InternalServerError:
                  description: InternalServerError
                  summary: InternalServerError
                  value:
                    code: BBS-40147
                    message: >-
                      Business details not found for given searchType:
                      BUSINESS_ID and searchValue: 8910048117
              schema:
                $ref: '#/components/schemas/ErrorInfo4'
          description: >
            Internal Server Error - An unexpected error occurred while
            retrieving business details.
      security:
        - bearerAuth: []
      summary: Get Business Details
      tags:
        - Business Banking
