  parameters:
    HostUserId:
      name: hostUserId
      in: query
      required: false
      description: >
        Unique identifier for the user associated with the financial
        institution. This is used to provide context 

        for the account’s e-statement preference. This parameter is **required**
        when the access token is

        issued using the **client_credentials** **grant type**; otherwise, it is
        optional.

        This parameter cannot be used together with the **loginId** query
        parameter.
      schema:
        type: string
        example: MULTIS01
    LoginId:
      name: loginId
      in: query
      required: false
      description: >
        Login identifier for the user associated with the financial institution,
        used to provide context

        for the account's e-statement preference. This parameter is **required**
        when the access

        token was issued using the `client_credentials` grant type; otherwise,
        it is optional.

        This parameter cannot be used together with the **hostUserId** query
        parameter.
      schema:
        type: string
        example: MULTIS01
    TransactionIdRequest:
      name: transactionId
      in: header
      required: true
      description: >-
        Unique identifier used to trace the request across services for
        debugging and logging.
      schema:
        type: string
        example: f8187c63-678f-4f0c-9263-46723794661a
    InstitutionId:
      name: institutionId
      in: header
      required: true
      description: |
        Unique identifier of the financial institution. **Required** when
        `grant_type` is `client_credentials` or `password`.
      schema:
        type: string
        example: 12345
    Authorization:
      name: Authorization
      in: header
      required: true
      description: >
        Standard HTTP Basic Authentication based on the `Client ID` and `Client
        Secret` provided during

        the application registration process.

        A string composed of `Basic`+ `(space)` + `base64encode(client_id + ":"
        + client_secret)`; example `Basic
        ODU4S0pRczVXwGdMRkhUUUhtSGhNdTRYHlpRa3N1ZGY6STA0UThtMFJZZEF1dUlwYg`
      schema:
        type: string
        example: >-
          Basic
          aU9tM2RHT2hFTlpweEtObDBZaDJ2Z1JuOW9QeUNvdTdmNGlqR1g2U0VVYTZXMkFZOkRVemRyb1kwNFZCcGxQQ1lFSEVINGY0R2hsYmxDSERTNnBVWmtRSGxYVmc0dlBMZUtGZmpGWGJjNWw2TGNqRng=
    AuthorizationRequest:
      name: Authorization
      in: header
      description: >-
        An OAuth2 access token that authorizes this request. Must be in the
        format Bearer {ACCESS_TOKEN}
      required: true
      schema:
        type: string
        example: Bearer rvYKAItOGiMQy1yOHdUDAHWp2HG1
    UserId:
      name: userId
      in: path
      required: true
      description: >-
        Unique identifier of the financial institution's customer whose status
        is being queried.
      schema:
        type: string
        example: MULTIS01
    UserIdType:
      name: userIdType
      in: query
      required: true
      description: >
        Specifies the format of the `userId` provided in the path. Supported

        values:

        - `INSTITUTION_USER_ID`: ID assigned by the financial institution

        - `HOST_USER_ID`: ID used by the host system

        - `LOGIN_ID`: User’s login identifier

        - `CUSTOMER_ID`: Unique customer identifier

        **Note**: The userIdType HOST_USER_ID is only applicable for RETAIL
        users.
      schema:
        type: string
        enum:
          - INSTITUTION_USER_ID
          - HOST_USER_ID
          - LOGIN_ID
          - CUSTOMER_ID
        example: HOST_USER_ID
    InstitutionIdPath:
      name: institution_id
      in: path
      required: true
      schema:
        type: string
      description: Institution identifier in MX.
      example: '05532'
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      description: MX user identifier.
      example: u-c0a8f373008002aa507614c93780fd00
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: >-
        Standard OAuth 2.0 access token. A string composed of 'Bearer' +
        '(space)' + '{token}'
      schema:
        type: string
      example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
    ExtHostHeader:
      name: ext_host
      in: header
      required: true
      schema:
        type: string
      description: Upstream host hint for the gateway.
