      ## Endpoints
  - name: Documents and Preferences
    description: >
      ## Product Overview


      The **Documents and Preferences** APIs manage document delivery
      preferences and disclosure compliance 

      for financial institutions. This consolidated category includes
      Disclosures management and E-Statement 

      preferences, enabling institutions to track compliance and customer
      document delivery choices.


      The **E-Statement API** enables customers to opt in for e-statement or
      paper statement preferences 

      for their accounts. Examples include accepting Terms or Conditions when
      enrolling for Online Banking 

      or signing up for electronic banking statements.


      ## End-User Benefits

      - View and accept required disclosures during onboarding

      - Opt-in/opt-out of electronic statement delivery

      - Update document delivery preferences at any time

      - Verify current statement preferences are activated


      ## Integration Capabilities

      - Create, retrieve, and update disclosure definitions

      - Track end-user acceptance of required disclosures

      - Manage e-statement enrollment at the account level

      - Integrate disclosure workflows into registration flows

      - Query disclosure and e-statement status programmatically


      ## What is Supported


      ### Disclosures


      **Institution Disclosures:**

      - Create, retrieve, and update disclosure definitions

      - Manage disclosure content (URL, CONFIG, or RAW data types)

      - Enable/disable disclosures for the institution


      **User Disclosures:**

      - Record user acceptance/rejection of disclosures

      - Query disclosure status for specific users

      - Support for account-specific disclosures


      ### E-Statements


      **Prerequisites:**

      - MultiStatement must be configured during onboarding to `true` for
      account level update and `false` for user level update

      - Multi-OLS disclosure agreement must be created for the account ID for
      account level update. 

      - Customer must be registered with the financial institution

      - Customer must accept terms and conditions for online banking

      - System must be configured with the customer's `hostUserId`

      - Customer must have an active status


      **Supported User Types:**

      - RETAIL


      **Capabilities:**

      - E-statement opt-in/out feature at the account or user level

      - View e-statement opt-in status for a given user account

      - Only one account preference can be changed at a time


      **Dependencies:**

      The E-Statement API interfaces with: Users API, Disclosures API, and
      Accounts API


      ## Required Scopes


      ### Disclosures


      | Scope | Permissions |

      |-------|-------------|

      | `disclosures:read` | Retrieve disclosure information |

      | `disclosures:write` | Create, update, or delete disclosures |

      | `institution-users:read` | Required with disclosures:read for user
      context |


      ### E-Statements


      | Scope | Permissions |

      |-------|-------------|

      | `accounts:read` | Get and find accounts |

      | `disclosures:read` | Get and find institution disclosure service |

      | `disclosures:write` | Update opt-in/out preferences |

      | `institution-users:read` | Check if customer is active |


      ## E-Statement Preference Properties


      ### Update Request


      | Property | Type | Description |

      |----------|------|-------------|

      | `activateEStatement` | Boolean | `true` to opt-in, `false` to opt-out |

      | `accountId` | String | Unique account ID for the preference update |


      ### Response Properties


      | Property | Description |

      |----------|-------------|

      | `institutionId` | Unique identifier of financial institution |

      | `institutionDisclosureStatus` | Disclosure status – whether accepted or
      not |

      | `institutionDisclosureName` | Name of the disclosure |

      | `paperWaiver` | `true` = e-statement opted in, `false` = paper statement
      |

      | `accountId` | Unique account ID of the customer |

      | `institutionUserDisclosureStatusUpdateDateTime` | Date/time when
      disclosure status was accepted |


      ## Required Headers


      | Header | Description |

      |--------|-------------|

      | `Authorization` | Bearer token (V2 authentication) |

      | `transactionId` | Unique identifier for request tracking |

      | `callingAppId` | ID of the calling application (optional) |


      ## Disclosure Data Types


      | Type | Description |

      |------|-------------|

      | `URL` | Disclosure content is hosted at a URL |

      | `CONFIG` | Disclosure content is in configuration format |

      | `RAW` | Disclosure content is provided as raw text |


      ## User Disclosure Statuses


      | Status | Description |

      |--------|-------------|

      | `ENROLLED` | User is enrolled for the disclosure (e.g., e-statements) |

      | `NOT_ENROLLED` | User is not enrolled |

      | `ACCEPTED` | User has accepted the disclosure |

      | `NOT_ACCEPTED` | User has not accepted the disclosure |


      ## Common Error Codes


      ### Request Validation Errors


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | DSC_10002 | Invalid request | 400 |

      | DSC_10009 | Invalid query param | 400 |

      | DSC_12001 | Request should only contain printable ASCII characters | 400
      |

      | DSC_12002 | Request is missing a transactionId header | 400 |

      | DSC_12003 | Request transactionId header is too long | 400 |

      | DSC_12004 | Required fields are not provided or not valid | 400 |

      | DSC_12005 | Request cannot be blank | 400 |

      | DSC_12006 | Invalid or empty account type in request | 400 |

      | DSC_12007 | Request header is too long | 400 |

      | DSC_12011 | One of the request field length is greater than max length |
      400 |

      | DSC_12012 | Disclosure ids from request body and URL do not match | 400
      |


      ### Authentication & Authorization Errors


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | DSC_11001 | Full authentication was not provided in the request | 401 |

      | DSC_11002 | The authentication token is invalid | 401 |

      | DSC_11003 | The authentication does not authorize this request | 401 |

      | DSC_11004 | A location id is required for business banking users | 400 |


      ### Data & Processing Errors (Disclosures)


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | DSC_10003 | Invalid operation | 501 |

      | DSC_13001 | Data not found for user | 400 |

      | DSC_13002 | Disclosures are not retrieved successfully | 500 |

      | DSC_13003 | Disclosures are not created successfully | 500 |

      | DSC_13004 | Disclosures are not updated successfully | 500 |

      | DSC_22001 | Internal validation error | 500 |

      | DSC_23002 | Error interacting with CBS Service | 500 |

      | DSC_23003 | Error interacting with CAS Service | 500 |

      | DSC_99999 | Internal server error | 500 |


      ### E-Statement Authentication Errors


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | UXESTMT_10001 | Required Authorization header is missing | 400 |

      | UXESTMT_10002 | Invalid JWT token | 400 |

      | UXESTMT_10003 | Required role not present in JWT token | 403 |

      | UXESTMT_10004 | JWT token has expired | 400 |

      | UXESTMT_10005 | JWT token is invalid and does not contain institution ID
      | 400 |

      | UXESTMT_10006 | JWT token is invalid and does not contain institution
      customer ID | 400 |

      | UXESTMT_10012 | Invalid Authorization in the header | 400 |


      ### E-Statement Request Validation Errors


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | UXESTMT_10007 | Required Correlation ID header is missing | 400 |

      | UXESTMT_10008 | Correlation ID is not a GUID | 400 |

