components:
  schemas:
    Accounts:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        totalGroupCount:
          type: string
          description: Total number of institutionCustomers/locations in JWT
    Account:
      type: object
      properties:
        id:
          type: string
          description: Unique Account Identifier (encrypted key identifier)
        description:
          type: string
          description: Description of account
        institutionUserId:
          type: string
          description: Unique user identifier
        institutionId:
          type: string
          description: Financial Institution id this account is associated with
        accountNumber:
          type: string
          description: Last 4 digits of the account number.
        nickName:
          type: string
          description: Account nickname
        type:
          $ref: '#/components/schemas/AccountType'
          description: Account type information
        category:
          $ref: '#/components/schemas/AccountCategory'
          description: Account category
        primaryHolderName:
          type: string
          description: >-
            Primary account holder name (OR) Cross member/customer name from
            host
        currentBalance:
          $ref: '#/components/schemas/Money'
        availableBalance:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/AccountStatus'
          description: Flags indicating the status of account.
        allowedActions:
          $ref: '#/components/schemas/Actions'
          description: >-
            Allowed actions on the account. Flags to identify account valid for
            transfers, display.
        routingNumber:
          type: string
          description: Routing number of the account.
        interestRate:
          type: number
          description: Interest rate.
          format: float
        interestYearToDate:
          $ref: '#/components/schemas/Money'
          description: Interest/Dividends earned YTD
        micrNumber:
          type: string
          description: 'MICR number for this account, returned only if known.'
        maturityDate:
          type: string
          description: Maturity date
          format: date
        term:
          $ref: '#/components/schemas/TermType'
          description: 'Term of account, duration could be in months/days/years/weeks'
        escrowBalance:
          $ref: '#/components/schemas/Money'
          description: Escrow balance
        currentPrincipalBalance:
          $ref: '#/components/schemas/Money'
          description: >-
            Current Principal Balance--Refers to the face amount of a debt
            instrument or an amount of money borrowed. As time goes by and as
            the end user makes payments on the loan, the principal balance goes
            down
        nextPaymentAmount:
          $ref: '#/components/schemas/Money'
          description: Payment amount
        nextPaymentDate:
          type: string
          description: Next payment date
          format: date
        payOffAmount:
          $ref: '#/components/schemas/Money'
          description: Loan payoff amount
        minimumPayment:
          $ref: '#/components/schemas/Money'
          description: Minimum payment (amount to avoid finance charge)
        lineOfCreditLimit:
          $ref: '#/components/schemas/Money'
          description: Line of credit limit
        loanOriginationDate:
          type: object
          description: Loan origination date
          format: date
        pastPrincipalDueDate:
          type: object
          description: Past due date for principal
          format: date
        lastPrincipalPaymentAmount:
          $ref: '#/components/schemas/Money'
          description: Last principal payment amount
        originalLoanAmount:
          $ref: '#/components/schemas/Money'
          description: Original loan amount
    Account_Nickname:
      type: object
      properties:
        nickName:
          type: string
          description: Account nickname
        isVisible:
          type: boolean
          description: >-
            Flag to indicate if the account is visible to the end user. Based on
            user preference stored
    AccountType:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/DIAccountType'
        fiAccountType:
          type: integer
          format: int64
          description: >-
            FI Account type from host - Based on FI level config this value
            could change
        description:
          type: string
          description: >-
            Account description returned from the host - FI can send custom
            account type description
    AccountStatus:
      type: object
      properties:
        open:
          type: boolean
        closed:
          type: boolean
        negativeBalance:
          type: boolean
        delinquent:
          type: boolean
        inCollection:
          type: boolean
        overLimit:
          type: boolean
        writtenOff:
          type: boolean
        creditBalance:
          type: boolean
        paymentCoupon:
          type: boolean
        retirementPlan:
          type: boolean
        retPlanOwnedByDeceased:
          type: boolean
        approved:
          type: boolean
        notApproved:
          type: boolean
        deleted:
          type: boolean
        verified:
          type: boolean
    Actions:
      type: object
      properties:
        summary:
          type: boolean
        transferFrom:
          type: boolean
        transferTo:
          type: boolean
        isHistoryEnabled:
          type: boolean
        isHistoryEntitled:
          type: boolean
    DIAccountType:
      type: string
      enum:
        - SAVINGS
        - CHECKING
        - MONEY_MARKET
        - BROKERAGE
        - LINE_OF_CREDIT_LOAN
        - TCL_CREDIT_LINE
        - UNKNOWN
        - KEOGH
        - RETIREMENT_401K
        - CERT_OF_DEPOSIT
        - CSI_CERT_OF_DEPOSIT
        - CREDIT_CARD_LOAN
        - INSTALLMENT_LOAN
        - CONSUMER_LOAN
        - COMMERCIAL_LOAN
        - MORTGAGE_LOAN
