    RegisterCustomerRequest:
      type: object
      xml:
        name: FICustomer
      description: >-
        Wrapper for the customer registration request. The JSON body must have a
        `FICustomer` root key; for XML the root element is `<FICustomer>`.
      required:
        - FICustomer
      properties:
        FICustomer:
          $ref: '#/components/schemas/FICustomerRequest'
    FICustomerRequest:
      type: object
      description: Customer profile fields accepted by the registration endpoint.
      properties:
        id:
          type: object
          description: >-
            Customer identifier. Set `value` to `"0"` and `type` to `"GUID"` for
            new registrations.
          properties:
            value:
              type: string
              description: Set to `"0"` for new registrations.
            type:
              type: string
              description: Set to `"GUID"`.
        fiId:
          type: object
          description: The Financial Institution ID.
          properties:
            value:
              type: string
              description: Must match the `di_fiid` path parameter.
        memberNumber:
          type: string
          description: >-
            Member number of the user in the FI's core system. Must be unique
            per registration. Max 16 alphanumeric characters.
        person:
          type: object
          description: Personal information for the customer.
          properties:
            personName:
              type: object
              properties:
                firstName:
                  type: string
                  description: First name (max 39 characters).
                lastName:
                  type: string
                  description: Last name (max 39 characters).
            contactInfo:
              type: object
              properties:
                emailAddress:
                  type: string
                  description: Email address (max 64 characters).
                postalAddress:
                  type: array
                  description: One or more postal addresses.
                  items:
                    type: object
                    properties:
                      address1:
                        type: string
                        description: Primary street address (max 128 characters).
                      address2:
                        type: string
                        description: 'Secondary address line (apt, suite, etc.).'
                      address3:
                        type: string
                        description: Tertiary address line.
                      city:
                        type: string
                        description: City name.
                      state:
                        type: string
                        description: >-
                          State or province code. Must be exactly 2 characters
                          for US addresses.
                      postalCode:
                        type: string
                        description: ZIP or postal code.
                      country:
                        type: string
                        description: Country code (e.g. `USA`).
                phoneNumber:
                  type: array
                  description: One or more phone numbers.
                  items:
                    type: object
                    properties:
                      number:
                        type: string
                        description: 'Phone number, 10 digits, no dashes.'
                      countryCode:
                        type: string
                        description: Country dialing code. Use `"0"` for US.
            birthDate:
              type: string
              description: Date of birth in `yyyy-MM-dd` format.
        channelInfos:
          type: object
          description: Channel enrollment information.
          properties:
            channelInfo:
              type: array
              description: >-
                One or more channel registrations. Each specifies a channel type
                and user credentials for that channel.
              items:
                type: object
                properties:
                  channelType:
                    type: string
                    description: >-
                      Channel type. Use `TPV_API` for third-party API
                      registrations.
                  credential:
                    type: object
                    properties:
                      loginId:
                        type: string
                        description: >-
                          Login ID for the channel. Must be unique, 6-256
                          characters. Allowed special characters: `@$*_-=.!~`.
                      password:
                        type: string
                        description: >-
                          Password for the channel. 6-32 characters, must
                          contain characters from at least 2 of: letters,
                          numbers, special characters.
        acceptedDisclosure:
          type: string
          description: >-
            Whether disclosures have been accepted. Set to `"false"` for initial
            registration.
        userType:
          type: string
          description: User type. Set to `"PRIMARY"` for standard registrations.
        ssn:
          type: string
          description: 'Social Security Number, exactly 9 digits.'
        motherMaidenName:
          type: string
          description: Mother's maiden name (max 128 characters).
        hostCredential:
          type: object
          description: Host system credential.
          properties:
            password:
              type: string
              description: ARS user PIN on the host system.
    RegisterCustomerResponse:
      type: object
      xml:
        name: FICustomer
      description: >-
        Wrapper for the registration response. The XML root element is
        `<FICustomer>` containing the created customer profile.
      properties:
        FICustomer:
          $ref: '#/components/schemas/FICustomerResponse'
    FICustomerResponse:
      type: object
      description: >-
        Customer profile as returned by the registration endpoint. Includes all
        fields from the request plus server-assigned values.
      properties:
        id:
          type: object
          description: >-
            Customer identifier. After successful registration, `value` contains
            the assigned GUID.
          properties:
            value:
              type: string
              description: The customer GUID assigned by the system.
            type:
              type: string
              description: Always `"GUID"`.
        fiId:
          type: object
          properties:
            value:
              type: string
              description: The Financial Institution ID.
        memberNumber:
          type: string
          description: The member number submitted in the request.
