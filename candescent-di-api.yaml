  /oauth2/v1/token:
    post:
      summary: Create V2 access token
      description: >
        **V2 Token Endpoint** - Use this endpoint for most current Candescent
        APIs (Accounts, Alerts, Banking Images, Disclosures, Money Movement,
        Transactions).


        Issues OAuth 2.0 access tokens for authenticated API access via the
        Candescent Developer Console.


        **Supported Grant Types:**

        - **client_credentials**: Institution-level access without user context.
        Subsequent API calls require `hostUserId` or `loginId` as query
        parameter.

        - **password**: User-level access with username and password. Returns
        both access token and refresh token.

        - **authorization_code**: (Internal use) For OpenID Connect flows.

        - **refresh_token**: Obtain new access token using a previously issued
        refresh token.


        **Authentication:** Use HTTP Basic Auth with `client_id` as username and
        `client_secret` as password.


        **Note:** For legacy V1 APIs (Send Event, Destinations, Get FI Customer,
        Register User), use the V1 token endpoint (`POST /v1/oauth/token`)
        instead.
      operationId: createTokenV1
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/TransactionIdRequest'
        - $ref: '#/components/parameters/InstitutionId'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: >-
          Payload specifying the access token to generate based on the
          `grant_type`.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ClientCredentialsRequest'
                - $ref: '#/components/schemas/PasswordRequest'
                - $ref: '#/components/schemas/AuthorizationCodeRequest'
                - $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              ClientCredentials:
                $ref: >-
                  #/components/examples/AccessTokenClientCredentialsRequestExample
              Password:
                $ref: '#/components/examples/AccessTokenPasswordRequestExample'
              AuthorizationCode:
                $ref: >-
                  #/components/examples/AccessTokenAuthorizationCodeRequestExample
              RefreshToken:
                $ref: '#/components/examples/AccessTokenRefreshTokenRequestExample'
      responses:
        '200':
          description: Successfully generated the access token.
          headers:
            transactionId:
              description: >-
                Unique identifier for the response, used to correlate with the
                request's transactionId.
              schema:
                type: string
                format: uuid
                example: f8187c63-678f-4f0c-9263-46723794661a
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ClientCredentialsResponse'
                  - $ref: '#/components/schemas/PasswordResponse'
                  - $ref: '#/components/schemas/AuthorizationCodeResponse'
                  - $ref: '#/components/schemas/RefreshTokenResponse'
              examples:
                ClientCredentials:
                  $ref: >-
                    #/components/examples/AccessTokenClientCredentialsResponseExample
                Password:
                  $ref: '#/components/examples/AccessTokenPasswordResponseExample'
                AuthorizationCode:
                  $ref: >-
                    #/components/examples/AccessTokenAuthorizationCodeResponseExample
                RefreshToken:
                  $ref: '#/components/examples/AccessTokenRefreshTokenResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '500':
          $ref: '#/components/responses/InternalServerError1'
  /oauth2/v1/revoke:
    delete:
      summary: Revoke access token
      description: >
        Revokes an active OAuth 2.0 access token, rendering it unusable for
        future API requests.


        **Use Cases:**

        - User logout flows

        - Token suspected to be compromised

        - Security incidents requiring immediate token invalidation


        **Authentication:** Use HTTP Basic Auth with `client_id` as username and
        `client_secret` as password.


        **Note:** Once revoked, the token cannot be restored. A new token must
        be obtained via the token endpoint.
      operationId: revokeTokenV1
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/TransactionIdRequest'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: Payload specifying the access token to invalidate.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevokeAccessTokenRequest'
            examples:
              default_example:
                $ref: '#/components/examples/RevokeAccessTokenRequestExample'
      responses:
        '204':
          description: The access token was successfully revoked. No content is returned.
          headers:
            transactionId:
              description: >-
                Unique identifier for the response, used to correlate with the
                request's transactionId.
              schema:
                type: string
                format: uuid
                example: f8187c63-678f-4f0c-9263-46723794661a
        '400':
          $ref: '#/components/responses/BadRequest1'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '500':
          $ref: '#/components/responses/InternalServerError1'
  '/db-users/v1/user-status/{userId}':
    get:
      summary: Get user status
      description: >-
        Retrieves comprehensive status information for a specified primary user,
        including account activity indicators such as active, locked, on hold,
        and registration status. If the user has associated sub-users, their
        respective status details are also included. Requires OAuth 2.0 Bearer
        token and transaction ID for authentication and traceability.
      operationId: getUserStatusV1
      tags:
        - Customer Management
      parameters:
        - $ref: '#/components/parameters/TransactionIdRequest'
        - $ref: '#/components/parameters/AuthorizationRequest'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdType'
      responses:
        '200':
          description: >-
            The request was successful. Returns detailed status information for
            the specified primary user and, if applicable, their associated
            sub-users.
          headers:
            transactionId:
              description: >-
                Unique identifier for the response, used to correlate with the
                request's transactionId.
              schema:
                type: string
                format: uuid
                example: f8187c63-678f-4f0c-9263-46723794661a
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatus2'
              examples:
                PrimaryUserResponse:
                  $ref: '#/components/examples/PrimaryUserResponseExample'
                PrimaryUserWithSubUserResponse:
                  $ref: '#/components/examples/PrimaryUserWithSubUserResponseExample'
                SubUserResponse:
                  $ref: '#/components/examples/SubUserResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest2'
        '401':
          $ref: '#/components/responses/Unauthorized2'
        '403':
          $ref: '#/components/responses/Forbidden2'
        '500':
          $ref: '#/components/responses/InternalServerError2'
