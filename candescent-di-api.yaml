      ## Endpoints
  - name: Money Movement
    description: >
      ## Product Overview


      The **Money Movement** APIs enable account holders to perform transfers
      between accounts at their 

      financial institution and to create and manage external recipients who can
      receive transfers.


      ## End-User Benefits

      - Transfer funds between their own accounts

      - Send money to other members at the same financial institution

      - Set up one-time or recurring scheduled transfers

      - Manage a list of trusted recipients for quick transfers


      ## Integration Capabilities

      - Create one-time and scheduled transfers between accounts

      - Manage transfer recipients (create, retrieve, update, delete)

      - Validate recipients before initiating transfers

      - Support loan payments and IRA contribution transfers

      - Configure scheduled recurring transfers with multiple frequencies


      ## What is Supported


      The Money Movement service supports:

      - **Transfers**: One-time and scheduled transfers between accounts

      - **Recipient Management**: Create, retrieve, update, and delete transfer
      recipients

      - **Validation**: Validate recipients before initiating transfers

      - **Loan Payments**: Support for various payment options (principal only,
      interest only, etc.)

      - **IRA Contributions**: Current and prior year contribution transfers


      ## Required Scopes


      | Scope | Permissions |

      |-------|-------------|

      | `recipients:read` | Read recipient information |

      | `recipients:write` | Create, update, and delete recipients |

      | `transfers:write` | Create transfers |


      ## Required Headers


      | Header | Description |

      |--------|-------------|

      | `Authorization` | Bearer token (V2 authentication) |

      | `transactionId` | Unique identifier for request tracking |

      | `callingAppId` | ID of the calling application (optional) |


      ## Transfer Types


      | Type | Description |

      |------|-------------|

      | Standard | Regular transfer between accounts |

      | Loan Payment | Transfer to pay loan balance |

      | IRA Contribution | Transfer for retirement contributions |

      | Recipient Transfer | Transfer to another member's account |


      ## Scheduled Transfer Frequencies


      | Frequency | Description |

      |-----------|-------------|

      | `ONETIME` | Single execution |

      | `DAILY` | Every day |

      | `WEEKLY` | Once per week |

      | `BIWEEKLY` | Every two weeks |

      | `TWICEMONTHLY` | Twice per month |

      | `MONTHLY` | Once per month |

      | `QUARTERLY` | Every three months |

      | `SEMIANNUALLY` | Twice per year |

      | `ANNUALLY` | Once per year |


      ## Common Error Codes


      ### Recipient Errors


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | REC_10005 | User not found at host | 400 |

      | REC_10006 | Invalid passcode | 400 |

      | REC_10007 | Invalid account | 400 |

      | REC_11001 | Full authentication was not provided in the request | 401 |

      | REC_11002 | The authentication token is invalid | 401 |

      | REC_11003 | The authentication does not authorize this request | 403 |

      | REC_12001 | Request should only contain printable ASCII characters | 400
      |

      | REC_12002 | Request is missing a transactionId header | 400 |

      | REC_12004 | Required fields are not provided or not valid | 400 |

      | REC_12009 | Invalid email | 400 |

      | REC_12011 | Request field length exceeds max length | 400 |

      | REC_12012 | Account type is not from the list of allowed types | 400 |

      | REC_13001 | This recipient already exists | 400 |

      | REC_13002 | This recipient nickname already exists | 400 |

      | REC_14004 | Recipient not found | 400 |

      | REC_14001 | Recipient not added to the database successfully | 500 |

      | REC_14002 | Recipient not deleted successfully | 500 |

      | REC_99999 | Server error | 500 |


      ### Transfer Errors


      | Code | Message | HTTP Status |

      |------|---------|-------------|

      | TFR_10000 | Client error. Transfer could not be completed | 400 |

      | TFR_10001 | Server error. Transfer could not be completed | 500 |

      | TFR_10002 | Invalid institution id | 400 |

      | TFR_10003 | The From account does not exist or could not be retrieved |
      400 |

      | TFR_10004 | The To account does not exist or could not be retrieved |
      400 |

      | TFR_10020 | The transfer amount is required | 400 |

      | TFR_10021 | The transfer amount is invalid | 400 |

      | TFR_10022 | The transfer amount exceeds the From account balance | 400 |

      | TFR_10025 | The From account is restricted from making a transfer | 400
      |

      | TFR_10026 | The To account is restricted from receiving a transfer | 400
      |

      | TFR_10029 | The From account and To account cannot be the same | 400 |

      | TFR_10050 | Recipient transfers not allowed | 400 |

      | TFR_10051 | Recipient not found | 400 |

      | TFR_10058 | The fromAccountId field is required | 400 |

      | TFR_10059 | The toAccountId field is required | 400 |

      | TFR_11001 | Full authentication was not provided in the request | 401 |

      | TFR_11002 | The authentication token is invalid | 401 |

      | TFR_11003 | The authentication does not authorize this request | 403 |


      ## Payment Status


      The **Payment Status** API provides webhook-style endpoints used to
      receive asynchronous status updates

      for payments processed through the Candescent Payment Connector service.


      These updates are typically sent by upstream payment providers (for
      example, Finzly) after a payment

      is accepted, processed, rejected, or settled. The receiving service
      correlates updates to a payment

      identifier and acknowledges receipt for downstream processing.


      ### Payment Status – End-User Benefits

      - Near real-time visibility into payment status changes

      - Faster troubleshooting for failed or rejected payments

      - Improved traceability and audit support using `transactionId`


      ### Payment Status – Integration Capabilities

      - Receive asynchronous payment status updates via POST webhook callbacks

      - Support correlation and traceability using `transactionId`

      - Provide a consistent error model for retryable/non-retryable failures


      ### Payment Status – Required Headers


      | Header | Description |

      |--------|-------------|

      | `Authorization` | Bearer token (OAuth2 authentication) |

      | `transactionId` | Unique identifier for request tracking |


      ## Endpoints
  - name: MX
    description: >
      ## Product Overview


      The **MX Service** is a unified API that connects your applications to MX
      Core Services through 

      the Candescent API Gateway. MX provides a comprehensive digital
      transformation platform that 

      enables financial institutions, fintechs, and fintech partners to harness
      customer financial 

      data for creating superior digital banking experiences, empowering money
      management, and 

      accelerating business growth.


      For the latest updated documentation, please refer to
      [https://docs.mx.com](https://docs.mx.com)


      ## Core Capabilities


      | Capability | Description |

      |------------|-------------|

      | **Account Aggregation** | Enable customers to see all their accounts in
      one place |

      | **Data Enhancement** | Organize raw transaction data to provide insights
      |

      | **Account Opening & Verification** | Streamlined account setup and
      identity verification |

      | **Personalized Financial Insights** | AI-driven money management
      recommendations |

      | **Mobile Banking Solutions** | Responsive widgets and web-based
      interfaces |


      ## End-User Benefits

      - View all accounts in one place with account aggregation

      - Receive AI-powered insights and money management recommendations

      - Access personal finance management tools and widgets

      - Experience seamless single sign-on across services


      ## Integration Capabilities

      - Integrate MX account aggregation into banking applications

      - Access enriched transaction data with categorization and insights

      - Embed MoneyMap widgets for personal finance management

      - Implement SSO for Nexus and MoneyMap integrations

      - Route requests to MX ecosystem hosts via `ext_host` header


      ## Supported APIs


      ### Active Integrations


      | API | Description |

      |-----|-------------|

      | **MX Platform API** | Core REST API for user and account management;
      uses base64-encoded institutional ID and API key for authorization |

      | **MDX Real Time & On Demand** | MX Data Exchange (MDX) v5 APIs for
      sending end-user financial data (users, members, accounts, transactions,
      holdings); RESTful API for real-time data sync |

      | **Nexus API** | Fully-featured RESTful API with advanced data objects
      including budgeting, categorization, classification, cleansing, net worth,
      cash flow, and scheduled payments |

      | **MoneyMap** | Web-based widget collection for personal finance
      management; embeddable in partner websites and webviews via one-time URLs
      |

      | **SSO API** | Single Sign-On authentication and widget URL provisioning;
      required for Nexus and MoneyMap integrations |


      ## Integration Points


      | Integration | Details |

      |-------------|---------|

      | **Authentication** | OAuth2 token generation for bearer token
      authentication |

      | **Host Routing** | `ext_host` header routing to MX partner ecosystem
      hosts (api.mx.com, live.moneydesktop.com, sso.moneydesktop.com,
      logs.moneydesktop.com) |

      | **Content Negotiation** | Configurable Accept headers for content-type
      negotiation (JSON, XML, AVRO, SSO formats) |

      | **Request Tracking** | Institution ID and transaction ID tracking via
      headers |


      ## Required Headers


      | Header | Description |

      |--------|-------------|

      | `Authorization` | Bearer token (OAuth2 authentication) |

      | `ext_host` | Target MX host for request routing |

      | `transactionId` | Unique identifier for request tracking |

      | `Accept` | Content-type preference (application/json, application/xml,
      etc.) |


      **Note:** Additional MX Platform API endpoints are available through the
      MX partner ecosystem. 

      Refer to [MX Documentation](https://docs.mx.com) for the complete API
      reference.


