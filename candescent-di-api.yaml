    get:
      summary: Get job by ID
      description: >
        Retrieves the status and details of a specific job. Use this endpoint to
        monitor the progress of user

        imports or other batch operations.


        **Job Status Values:**

        - `CREATED`: Job queued for processing

        - `PROCESSING`: Currently processing records

        - `SUCCESSFUL`: All records processed without errors

        - `PARTIAL_SUCCESS`: Some records succeeded, others failed

        - `FAILED`: Job failed to complete


        For failed or partial success jobs, use GET
        `/groups/v3/jobs/{jobId}/errors` to retrieve error details.
