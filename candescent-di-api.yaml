  /db-transactions/v1/transactions:
    get:
      summary: List account transactions
      description: >
        Retrieves transaction history for a specified account. Transactions
        include all financial 

        actions performed by the customer including deposits, withdrawals,
        transfers, and payments.


        **Key Features:**

        - Filter by date range using startDate and endDate parameters

        - Retrieve pending/future transactions with retrieveFutureTransactions
        parameter

        - Business Banking support with institutionCustomerId for
        location-specific transactions

        - Returns transaction details including amounts, types, status
        indicators, and image identifiers


        **Date Parameters:**

        - Dates must be in ISO 8601 format (YYYY-MM-DD)

        - Start date must be before or equal to end date

        - If no dates provided, returns transactions based on FI-configured
        default range


        See the Transactions tag documentation for complete error codes and
        additional details.
      operationId: listTransactionsV1
      tags:
        - Accounts
      parameters:
        - name: transactionId
          in: header
          description: >-
            An ID that identifies this request. A unique identifier should be
            generated for each request made.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          description: >-
            Standard OAuth 2.0 access token. A string composed of 'Bearer' +
            '(space)' + '{token}'
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: hostUserId
          in: query
          required: false
          description: >
            Identifier for the user associated with the financial institution.
            This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `loginId` query parameter.
          schema:
            type: string
        - name: loginId
          in: query
          required: false
          description: >
            Login identifier for the user associated with the financial
            institution. This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `hostUserId` query parameter.
          schema:
            type: string
        - name: accountId
          in: query
          description: The ID of the account for which transactions are being requested.
          required: true
          schema:
            type: string
        - name: institutionCustomerId
          in: query
          description: >-
            The institution customer id that identifies the location for which
            transactions should be retrieved. Required for BB users.
          schema:
            type: string
        - name: startDate
          in: query
          description: >-
            The start of the date range for which transactions will be retrieved
            (inclusive). If included, this date must be before or the same as
            the end date, otherwise the request will fail.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: >-
            The end of the date range for which transactions will be retrieved
            (inclusive). If included, this date must be after or the same as the
            start date, otherwise the request will fail.
          schema:
            type: string
            format: date
        - name: retrieveFutureTransactions
          in: query
          description: >-
            When true, adds an FI configurable number of days to today, and sets
            this date as the end date. If an end date is sent in the request,
            this parameter will override it.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Success
          headers:
            transactionId:
              description: The transaction ID that was sent in the request header.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
              example:
                transactions:
                  - id: wVQpyoHllR2nnzrTb06i5TpJxiMz6zBoJEZYQZtnr6M
                    institutionId: 03079
                    accountId: lkaUm1sc4plDcg4g3wD49mryCiXe92u7NihqycCgV10
                    transactionNumber: '39000400'
                    transactionDate: '2019-09-25'
                    effectiveDate: '2019-09-25'
                    memo: Memo One
                    description: Transaction One
                    amount:
                      currencyCode: USD
                      amount: 100
                    type: WITHDRAWAL
                    isCreditTransaction: false
                    isExportable: true
                    isPending: true
                  - id: pr8MAfoJdCacaBAOeKqZVkM6w-Aq-NcrT9Ni5p3FsqQ
                    institutionId: 03079
                    accountId: lkaUm1sc4plDcg4g3wD49mryCiXe92u7NihqycCgV10
                    transactionNumber: '39000398'
                    transactionDate: '2019-09-21'
                    effectiveDate: '2019-09-21'
                    memo: Memo Two
                    description: Transaction Two
                    amount:
                      currencyCode: USD
                      amount: 300
                    type: WITHDRAWAL
                    isCreditTransaction: false
                    isExportable: true
                    isPending: false
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
  /db-transfers/v1/transfers:
    post:
      summary: Create transfer
      description: >
        Creates a one-time or scheduled recurring transfer between accounts.
        Supports various 

        transfer types including standard transfers, loan payments, and IRA
        contributions.


        **Transfer Types:**

        - **Standard**: Regular transfer between user's own accounts

        - **Recipient**: Transfer to another member at the same institution

        - **Loan Payment**: Transfer to pay down a loan balance

        - **IRA Contribution**: Transfer for retirement account contributions


        **Scheduling Options:**

        - **One-time**: Execute immediately or on a specific future date

        - **Recurring**: Set up automatic transfers on a schedule (daily,
        weekly, monthly, etc.)


        **Payment Options for Loans:**

        - `DEFAULT`: Standard payment

        - `PRINCIPAL_ONLY`: Apply payment to principal only

        - `INTEREST_ONLY`: Apply payment to interest only

        - `EXCESS_TO_PRINCIPAL`: Extra amount goes to principal

        - `EXCESS_TO_INTEREST`: Extra amount goes to interest
      operationId: createTransferV1
      tags:
        - Money Movement
      parameters:
        - name: transactionId
          in: header
          description: A unique identifier for this request.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          description: >-
            Standard OAuth 2.0 access token. A string composed of 'Bearer' +
            '(space)' + '{token}'
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: hostUserId
          in: query
          required: false
          description: >
            Identifier for the user associated with the financial institution.
            This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `loginId` query parameter.
          schema:
            type: string
        - name: loginId
          in: query
          required: false
          description: >
            Login identifier for the user associated with the financial
            institution. This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `hostUserId` query parameter.
          schema:
            type: string
      requestBody:
        description: >
          The transfer request object containing source account, destination
          account, amount, 

          and optional scheduling information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
          application/xml:
            schema:
              $ref: '#/components/schemas/Transfer'
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
            application/xml:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
      x-codegen-request-body-name: transferRequest
