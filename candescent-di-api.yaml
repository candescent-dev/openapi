            type: string
        - name: Authorization
          in: header
          description: >-
            Standard OAuth access token. A string composed of `Bearer` +
            `(space)` + `{token}`; example `Bearer
            rvYKAItOGiMQy1yOHdUDAHWp2HG1`.
          required: true
          schema:
            type: string
