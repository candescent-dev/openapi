            HTTP request. **Note:** This should be the originating device,
            rather than the client making the request (e.g., if a mobile device
            is used, the IP address should be that of the mobile device, rather
            than a back-end service).
          schema:
            type: string
            default: ' '
        - name: user-agent
          in: header
          description: >-
            Identifies the application and the platform making the request. The
            expected format is `{Appname}/{Appversion}[/{DeviceID}][;{Platform
            User-Agent}]`.
          schema:
            type: string
            default: ' '
        - name: offering_id
          in: header
          description: >-
            Uniquely identifies the name of the client app making the request.
            When not provided, this is derived based on a property held against
            the application within Apigee.
          schema:
            type: string
            default: ' '
        - name: Accept
          in: header
          description: >-
            Optional. The data format the client expects to receive in the
            response. Currently the only supported value application/xml. In the
            future we will support application/json. If no value is provided,
            the default is application/xml.
          schema:
            type: string
            default: ' '
        - name: fiId
          in: path
          description: the ID assigned to the financial institution.
          required: true
          schema:
            type: string
        - name: fiCustomerId
          in: path
          description: >-
            the ID for the requested customer.  This may be specified with
            various values, depending on the fiCustomerIDType parameter.  The
            default is to send the internal ID.
          required: true
          schema:
            type: string
        - name: Cache-Control
          in: header
          description: >-
            Optional. Valid value is no-cache. If the caller includes this
            header value, CBS will empty the cache for the user (regardless of
            its age) and go to the database to get a fresh copy of the data.
          schema:
            type: string
            default: ' '
        - name: fiCustomerIdType
