  /ux-users/v1/e-statements/preference:
    put:
      summary: Update account e-statement preference
      description: >
        ### Before you call


        - **MultiStatement** — This API is available only when
        **MultiStatement** is configured **`true`** for the financial
        institution during the onboarding process (account-level statement
        preference).

        - **Disclosure** — The preference applies only when the required
        e-statement disclosure agreement exists for the **account** in the
        request (for example Multi-OLS where configured). If no disclosure is
        available for that account, the call may fail (for example **404**). 

        - **Access token** — Obtain a **V2** OAuth 2.0 access token by calling
        **`POST /oauth2/v1/token`** (Authentication API — **Create V2 access
        token**). Grant types, required headers (for example `institutionId`,
        `transactionid`), and form body are defined on that operation. Send the
        token in the `Authorization` header as `Bearer <access_token>`. See the
        [Authentication API reference](/api/generated/authentication/).


        ### Behavior


        Updates whether account statements are delivered electronically or by
        mail for a **single** account. This preference is set per account, not
        for all accounts at once.
      operationId: updateStatementDeliveryPreference
      tags:
        - Documents and Preferences
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'OAuth 2.0 access token for authentication. Format: ''Bearer {token}'''
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: correlationId
          in: header
          required: true
          description: >-
            UUID used to trace and correlate requests across services for
            debugging and logging.
          schema:
            type: string
            format: uuid
            example: f8187c63-678f-4f0c-9263-46723794661a
        - $ref: '#/components/parameters/HostUserId'
        - $ref: '#/components/parameters/LoginId'
      requestBody:
        description: >-
          Payload specifying the user's preferred account statement delivery
          method (e-statement or mail) for a given account.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EStatementRequest'
      responses:
        '200':
          description: Statement preference updated successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
              example:
                status: 400
                message: Required Correlation ID header is missing
                code: UXESTMT_10007
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
              example:
                status: 401
                message: User is not authorized to perform this operation
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
              example:
                status: 403
                message: User does not have access
        '404':
          description: No entitled account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
              example:
                status: 404
                message: Disclosures name is not available for the given account ID
                code: UXESTMT_88891
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
              example:
                status: 500
                message: >-
                  An unexpected error occurred when talking to the downstream
                  service - service may be down
                code: UXESTMT_30001
  /ux-users/v2/e-statements/user/preferences:
    put:
      summary: Update user e-statement preferences
      description: >
        ### Before you call


        - **MultiStatement** — This API is available only when the
        **MultiStatement** feature configured to `false` for the financial
        institution during the onboarding process.

        - **Disclosure** — The preference applies only where the applicable
        e-statement disclosure has been approved for the user. 

        - **Access token** — Obtain a **V2** OAuth 2.0 access token by calling
        **`POST /oauth2/v1/token`** (Authentication API — **Create V2 access
        token**). Grant types, required headers (for example `institutionId`,
        `transactionid`), and form body are defined in that operation. Then pass
        the token in the `Authorization` header as `Bearer <access_token>`. For
        full details, see the [Authentication API
        reference](/api/generated/authentication/).


        ### Behavior


        Enables users to apply a unified statement delivery preference (online
        or mail) to **all** of their accounts. 
      operationId: updateUserEStatementPreferencesV2
      tags:
        - Documents and Preferences
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'OAuth 2.0 access token for authentication. Format: ''Bearer {token}'''
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: correlationId
          in: header
          required: true
          description: >-
            UUID used to trace and correlate requests across services for
            debugging and logging.
          schema:
            type: string
            format: uuid
            example: f8187c63-678f-4f0c-9263-46723794661a
        - $ref: '#/components/parameters/HostUserId'
        - $ref: '#/components/parameters/LoginId'
      requestBody:
        description: >-
          Payload specifying the user's preferred e-statement delivery method
          for all accounts.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EStatementPreferencesRequest'
            examples:
              default_example:
