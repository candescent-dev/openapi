  /db-banking-images/v1/banking-images:
    get:
      summary: List banking images
      description: >
        Returns a list of available scanned document images based on query
        parameters including account, image

        type, and date range. The response contains individual image IDs and
        metadata that can be used to retrieve, view,

        and print specific images.


        **Image Types:**

        - `CHECK` - Check images (requires transactionDate and
        transactionImageNumber)

        - `DEPOSIT_SLIP` - Deposit slip images (requires transactionDate and
        transactionImageNumber)

        - `STATEMENT` - Statement images (requires statementStartDate and
        statementEndDate)


        **Use this endpoint to:**

        - Build a UI component displaying available images for customers

        - Retrieve image metadata for transaction history displays

        - Get image IDs for subsequent individual image retrieval
      operationId: listBankingImagesV1
      tags:
        - Accounts
      parameters:
        - name: transactionId
          in: header
          description: >-
            An ID that identifies this request. A unique identifier should be
            generated for each request made.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          description: >-
            Standard OAuth 2.0 access token. A string composed of 'Bearer' +
            '(space)' + '{token}'
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: hostUserId
          in: query
          required: false
          description: >
            Identifier for the user associated with the financial institution.
            This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `loginId` query parameter.
          schema:
            type: string
        - name: loginId
          in: query
          required: false
          description: >
            Login identifier for the user associated with the financial
            institution. This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `hostUserId` query parameter.
          schema:
            type: string
        - name: accountId
          in: query
          description: The ID of the account for which images are being requested.
          required: true
          schema:
            type: string
        - name: imageType
          in: query
          description: >-
            The type of the image(s) to fetch. The possible options are CHECK,
            DEPOSIT_SLIP, and STATEMENT.
          required: true
          schema:
            type: string
        - name: transactionDate
          in: query
          description: >-
            This param is only applcable for check or deposit slip images. This
            is the date of the transaction. This is a required parameter when
            the imageType is CHECK or DEPOSIT_SLIP.
          schema:
            type: string
            format: date
        - name: transactionImageNumber
          in: query
          description: >-
            This param is only applicable for check or deposit slip images. This
            is a reference number on the check (eg. check number) or the deposit
            slip (eg. deposit slip number). This is a required parameter when
            the imageType is CHECK or DEPOSIT_SLIP.
          schema:
            type: string
        - name: statementStartDate
          in: query
          description: >-
            The start of the date for which statement images will be retrieved
            (inclusive). If included, this date must be before or the same as
            the end date, otherwise the request will fail.
          schema:
            type: string
            format: date
        - name: statementEndDate
          in: query
          description: >-
            The end of the date for which statement images will be retrieved
            (inclusive). If included, this date must be after or the same as the
            start date, otherwise the request will fail.
          schema:
            type: string
            format: date
        - name: statementPreview
          in: query
          description: >-
            The param is only applicable for statement images. This supports one
            OLS vendor. The vendor’s host request requires a statementPreview
            parameter.The options are PREVIEW or CURRENT which allows an
            administrator to view a preview of the Statement List. From AP, an
            administrator can view a preview of the Statement List. Only the
            request originating from AP will send the preview=true parameter.
          schema:
            type: string
        - name: institutionCustomerId
          in: query
          description: >-
            LocationId for the business banking user for which onlinestatements
            are being retrieved. This is a required parameter for BB User.
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankingImages'
            application/xml:
              schema:
                $ref: '#/components/schemas/BankingImages'
        '204':
          description: |
            No Content
            Possible causes:
            - No statement images are available for a single user
            associated with account.
            - No statement images are available for all the users
            associated with accounts.
          content: {}
        '400':
          description: |
            Bad request
            Possible causes:
            - The dates provided were either unparseable or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '401':
          description: |
            Unauthorized
            Possible causes:
            - Full authentication was not provided in the request.
            - The authentication token that was sent in the request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '403':
          description: |
            Forbidden
            Possible causes:
            - The authentication provided does not authorize this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '500':
          description: |
            Not found
            Possible causes:
            - Images retrieval is not enabled for this account.
            - This user is not entitled to see images for this account.
            - Images for this account are available on an external site.
            - Various server errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
