      ## Endpoints
  - name: Customer Campaigns
    description: >
      ## Product Overview


      The **Customer Campaigns** APIs provide comprehensive services for user
      segmentation, group management, 

      and promotional campaign delivery. This consolidated category includes
      Experience Groups for user 

      cohort management and Promotions for marketing campaign targeting.


      ## Integration Capabilities

      - Create and manage experience groups for user segmentation

      - Bulk upload user lists via CSV (ADD, REMOVE, REPLACE operations)

      - Monitor import job status and retrieve error details

      - Control feature rollouts and A/B testing with defined cohorts

      - Upload user lists to Promotion Suite for campaign targeting

      - Enable personalized experiences for different customer segments


      ## What is Supported


      ### Experience Groups


      - **Group Management**: Create, update, list, and delete experience groups

      - **Participant Management**: Upload user lists (ADD, REMOVE, REPLACE
      operations)

      - **Job Monitoring**: Track batch import status, view job history, and
      retrieve error details

      - **Pagination**: Navigate through large result sets efficiently


      ### Promotions


      - **User List Upload**: Enqueue user lists for upload to Promotion Suite

      - **Status Tracking**: Monitor the status of user list uploads


      ## File Upload Requirements


      When uploading participants to Experience Groups, the CSV file must:

      - Contain participant IDs (max 32 characters each)

      - Specify the operation type: `ADD`, `REMOVE`, or `REPLACE`

      - Be uploaded as multipart/form-data


      ## Job Statuses (Experience Groups)


      | Status | Description |

      |--------|-------------|

      | `CREATED` | Job has been created and is pending processing |

      | `PROCESSING` | Job is currently being processed |

      | `SUCCESSFUL` | All records were processed successfully |

      | `PARTIAL_SUCCESS` | Some records succeeded, some failed |

      | `FAILED` | Job failed to process |


      ## Required Headers


      | Header | Description |

      |--------|-------------|

      | `Authorization` | Bearer token (V2 authentication) |

      | `transactionId` | UUID for request tracking (fish tag) |


