  /db-events/v1/realtime-events:
    post:
      summary: Publish alert event
      description: >
        Trigger an alert notification when an event occurs. This API processes
        the event data and sends notifications based on the configured alert
        type, template, and customer preferences.


        **Event Domain Types:**

        - **AccountEvent**: Account-related alerts (balance changes, low
        balance, etc.)

        - **TransactionEvent**: Transaction-related alerts (large transactions,
        payment exceeding limit, etc.)

        - **NotificationEvent**: Messages from external parties (such as Visa)
        that pass through to the customer without additional processing

        - **UserEvent**: User-related events (login, password change, etc.)


        **Processing Flow:**

        1. Event is received and validated

        2. Alert type and user preferences are matched

        3. Template is applied with event data

        4. Notifications are sent via configured channels (EMAIL, SMS, PUSH)
      operationId: publishAlertEventsV1
      tags:
        - Alert Delivery
      parameters:
        - name: transactionId
          in: header
          description: A unique identifier for this request.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          description: >-
            Standard OAuth 2.0 access token. A string composed of 'Bearer' +
            '(space)' + '{token}'
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: institutionCustomerId
          in: header
          description: institutionCustomerId
          required: false
          schema:
            type: string
        - name: hostUserId
          in: query
          required: false
          description: >
            Identifier for the user associated with the financial institution.
            This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `loginId` query parameter.
          schema:
            type: string
        - name: loginId
          in: query
          required: false
          description: >
            Login identifier for the user associated with the financial
            institution. This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `hostUserId` query parameter.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
        description: event
        required: true
      responses:
        '202':
          description: Event accepted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '500':
          description: >-
            Internal error. Error codes: PRMSYS_10002 (Malformed input data),
            PRMSYS_10003 (Missing eventDetails or notification), PRMSYS_10007
            (Missing mandatory fields), PRMSYS_10008 (Invalid institutionId),
            PRMSYS_10013 (Missing Authorization Token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
