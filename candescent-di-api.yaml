                    message: Registration created successfully
                    onlineFeatures:
                      - ACH
                      - Wire Transfer
                      - Bill Pay
                    registrationDate: '11/20/2025 10:33:25 AM PST'
                    status: PENDING
                    tins:
                      - memberNumber: '9749374838'
                        primary: true
                        tinName: Acme Corp
                        tinNumber: '123456789'
                    users:
                      - email: jane.doe@acme.com
                        firstName: Jane
                        lastName: Doe
                        phoneNumber: 415-555-5678
                        role: PRIMARY_ADMIN
              schema:
                $ref: '#/components/schemas/BbRegistration'
          description: Business registration retrieved successfully.
        '400':
          content:
            application/json:
              examples:
                BadRequestInvalidInputData:
                  description: BadRequestInvalidInputData
                  summary: BadRequestInvalidInputData
                  value:
                    code: BBS-40095
                    message: Invalid registrationId
              schema:
                $ref: '#/components/schemas/ErrorInfo4'
          description: >
            Bad Request - Invalid Registration Id format or missing required
            parameters.
        '401':
          content:
            application/json:
              examples:
                InvalidJwt:
                  description: InvalidJwt
                  summary: InvalidJwt
                  value:
                    code: BBS-40150
                    message: Invalid JWT
              schema:
                $ref: '#/components/schemas/ErrorInfo4'
          description: Unauthorized - Authentication credentials are missing or invalid.
        '403':
          content:
            application/json:
              examples:
                InvalidRolesOrEntitlements:
                  description: InvalidRolesOrEntitlements
                  summary: InvalidRolesOrEntitlements
                  value:
                    code: BBS-40151
                    message: Invalid roles or entitlements
              schema:
                $ref: '#/components/schemas/ErrorInfo4'
          description: Unauthorized - Invalid roles or entitlements.
        '404':
          content:
            application/json:
              examples:
