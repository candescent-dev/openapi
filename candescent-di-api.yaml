    ClientCredentialsRequest:
      description: |
        Used to generate an institution-level access token without user-specific
        context.
        Requires grant_type=client_credentials.
      type: object
      properties:
        grant_type:
          description: Specifies the OAuth 2.0 grant type used to request the access token.
          type: string
          enum:
            - client_credentials
            - password
            - authorization_code
            - refresh_token
    PasswordRequest:
      description: |
        Used to generate a user-level access token based on username and
        password credentials.
        Requires grant_type=password.
      type: object
      properties:
        grant_type:
          description: Specifies the OAuth 2.0 grant type used to request the access token.
          type: string
          enum:
            - client_credentials
            - password
            - authorization_code
            - refresh_token
        username:
          description: The user's login identifier used for authentication.
          type: string
          example: userTest
        password:
          description: The password corresponding to the provided username.
          type: string
          example: Test@123
      required:
        - grant_type
        - username
        - password
    AuthorizationCodeRequest:
      description: |
        (Internal Use) Used in OpenID Connect (OIDC) flows to exchange
        an authorization code for an access token.
        Requires grant_type=authorization_code.
      type: object
      properties:
        grant_type:
          description: Specifies the OAuth 2.0 grant type used to request the access token.
          type: string
          enum:
            - client_credentials
            - password
            - authorization_code
            - refresh_token
        code:
          description: >-
            The authorization code obtained from the authorization server, used
            to exchange for an access token.
          type: string
          example: 0CE0b2NA
      required:
        - grant_type
        - code
    RefreshTokenRequest:
      description: |
        Used to obtain a new access token using a previously issued refresh
        token.
        Requires grant_type=refresh_token.
      type: object
      properties:
        grant_type:
          description: Specifies the OAuth 2.0 grant type used to request the access token.
          type: string
          enum:
            - client_credentials
            - password
            - authorization_code
            - refresh_token
        refresh_token:
          description: >-
            A valid refresh token used to request a new access token without
            re-authenticating the user.
          type: string
          example: 5Kjn3DsFK4MwL138Tx0zA2xLsMSEoJRq
      required:
        - grant_type
        - refresh_token
    ClientCredentialsResponse:
      description: Response containing the institution-level access token.
      type: object
      properties:
        access_token:
          description: The issued access token used to authorize API requests.
          type: string
          example: C9pZ6NvdteSuz367601awfLkoALZ
        expires_in:
          description: Duration (in seconds) before the access token becomes invalid.
          type: string
          example: 2591999
        token_type:
          description: 'Indicates the token type, typically Bearer.'
          type: string
          example: Bearer
    PasswordResponse:
      description: Response containing the user-level access token and refresh token.
      type: object
      properties:
        access_token:
          description: The issued access token used to authorize API requests.
          type: string
          example: C9pZ6NvdteSuz367601awfLkoALZ
        expires_in:
          description: Duration (in seconds) before the access token becomes invalid.
          type: string
          example: 2591999
        token_type:
          description: 'Indicates the token type, typically Bearer.'
          type: string
          example: Bearer
        refresh_token:
          description: >-
            A token that can be used to obtain a new access token after the
            current one expires.
          type: string
          example: 5Kjn3DsFK4MwL138Tx0zA2xLsMSEoJRq
        refresh_token_expires_in:
          description: Duration (in seconds) before the refresh token becomes invalid.
          type: string
          example: 15551999
    AuthorizationCodeResponse:
      description: >-
        Response containing access and refresh tokens, and optionally an ID
        token with user identity information.
      type: object
      properties:
        access_token:
          description: The issued access token used to authorize API requests.
          type: string
          example: C9pZ6NvdteSuz367601awfLkoALZ
        expires_in:
          description: Duration (in seconds) before the access token becomes invalid.
          type: string
          example: 2591999
        token_type:
          description: 'Indicates the token type, typically Bearer.'
          type: string
          example: Bearer
        refresh_token:
          description: >-
            A token that can be used to obtain a new access token after the
            current one expires.
          type: string
          example: 5Kjn3DsFK4MwL138Tx0zA2xLsMSEoJRq
        id_token:
          description: >-
            A JWT containing user identity claims, typically used in OpenID
            Connect flows.
          type: string
          example: >-
            eyJ0eXAiOiJKV1QiLCJraWQiOiJpZFRva2VuUnNhS2V5IiwiYWxnIjoiUlMyNTYifQ..FL2gdU9DmL_6x6iKX6eDls6LQsBnfQxCyBTvUUMoOcnXvxL1HfzovBMGbTIQZ6Tk94VNkPKqNik0z8hLx2TftKSP2M0fLyTBMFjNfODuZ4oMMwfoACTVhPoFXERrUJQg68kP5bsBGzUVPnjywiTI_TAeo2KAOhkuE9-t-nX98V7RZXZ4YBlmqgfEaA4OHe-B5Dt6NPumXIBGoLhbK2K3T_OZR5-CdtO9xjOnDdEbZMHI9lV6b5CFo5NdmQgGZvsn0WSQBXIp_MoqS0WgFMUT7I78U9sjOBBbDq-lWJ9J9y67N09S_vlU4cK4j_0oidYMb8eNrzk2AK2k5jYiSRuEZg
    RefreshTokenResponse:
      description: Response containing a refreshed access token and a new refresh token.
      type: object
      properties:
        access_token:
          description: The issued access token used to authorize API requests.
          type: string
          example: C9pZ6NvdteSuz367601awfLkoALZ
        expires_in:
          description: Duration (in seconds) before the access token becomes invalid.
          type: string
          example: 2591999
        token_type:
          description: 'Indicates the token type, typically Bearer.'
          type: string
          example: Bearer
        refresh_token:
          description: >-
            A token that can be used to obtain a new access token after the
            current one expires.
          type: string
          example: 5Kjn3DsFK4MwL138Tx0zA2xLsMSEoJRq
        refresh_token_expires_in:
          description: Duration (in seconds) before the refresh token becomes invalid.
          type: string
          example: 15551999
    RevokeAccessTokenRequest:
      description: Payload containing the access token to revoke.
      type: object
      properties:
        token:
          description: >-
            The OAuth 2.0 access token to be invalidated. Once revoked, it
            cannot be used for API access.
          type: string
          example: GNAW1ogAtmPQ1LGyL6UGrzUtgS6j
    Error3:
      description: >-
        Standard error object containing an application-specific error code and
        a descriptive message explaining the issue.
      type: object
      properties:
        code:
          description: Application-specific error code.
          type: string
          example: CMN_90011
        message:
          description: Detailed description of the error.
          type: string
          example: Request is invalid.
    InstitutionUserId:
      description: A unique identifier assigned to a user by the financial institution.
      type: string
      x-internal: true
      example: 17CE8F1D6FA85950E063C0A011ACD90F
    Active:
      description: Boolean flag indicating if the user account is currently active.
      type: boolean
      x-internal: true
    OnHold:
      description: Boolean flag indicating if the account is temporarily placed on hold.
      type: boolean
      x-internal: true
    Locked:
      description: >-
        Boolean flag indicating if the account is locked due to repeated failed
        login attempts.
      type: boolean
      x-internal: true
    Reset:
      description: Boolean flag indicating if the user’s password has been reset.
      type: boolean
      x-internal: true
    Registered:
      description: >-
        Boolean flag indicating if the user has successfully completed the
        registration process.
      type: boolean
      x-internal: true
    Approved:
      description: >-
        Boolean flag indicating if the user has been approved to access online
        banking services.
      type: boolean
      x-internal: true
    Rejected:
      description: >-
        Boolean flag indicating if the user has been denied access to online
        banking services.
      type: boolean
      x-internal: true
    InvalidEmailAddress:
      description: >-
        Boolean flag indicating if the user’s email address is incorrectly
        formatted.
      type: boolean
      x-internal: true
    UserStatus2:
      description: >-
        Contains status details for a primary user and, if applicable, their
        associated sub-users. Includes account activity flags and additional
        metadata.
      type: object
      properties:
        institutionUserId:
          $ref: '#/components/schemas/InstitutionUserId'
        active:
          $ref: '#/components/schemas/Active'
        onHold:
          $ref: '#/components/schemas/OnHold'
        locked:
          $ref: '#/components/schemas/Locked'
        reset:
          $ref: '#/components/schemas/Reset'
        registered:
          $ref: '#/components/schemas/Registered'
        approved:
          $ref: '#/components/schemas/Approved'
        rejected:
          $ref: '#/components/schemas/Rejected'
        invalidEmailAddress:
          $ref: '#/components/schemas/InvalidEmailAddress'
        additionalInfo:
          $ref: '#/components/schemas/StatusAdditionalInfo'
        subUsers:
          $ref: '#/components/schemas/SubUserStatus'
    StatusAdditionalInfo:
      description: >-
        Supplementary information including failed login and password reset
        counts, last successful login timestamp, and hold-related metadata.
      type: object
      properties:
        failedLoginCount:
          description: Total number of failed login attempts.
          type: integer
          example: '0'
        failedPasswordResetCount:
          description: Total number of failed password reset attempts.
          type: integer
          example: '0'
        lastLoginDateTime:
          description: >-
            Timestamp of the user's most recent successful login. Available only
            for primary users or when querying a single subUser.
          type: string
          format: date-time
          example: '2025-07-01T08:23:41-07:00'
        holdDateTime:
          description: >-
            Timestamp when the account was placed on hold. Present only if
            onHold is true.
          type: string
          format: date-time
          example: '2025-07-01T08:23:41-07:00'
        holdReason:
          description: Reason for placing the account on hold.
          type: string
        holdInitiatedBy:
          description: Identifier of the admin who initiated the hold.
          type: string
    SubUserStatus:
      description: >-
        Contains status details for a subUser, including account activity flags
        and metadata. Also includes a reference to the associated primary user.
      type: object
      properties:
        institutionUserId:
          $ref: '#/components/schemas/InstitutionUserId'
        parentInstitutionUserId:
          description: Unique identifier of the primary user.
          type: string
          example: B223E61AB9CB3ECBE0535A85660A8853
        active:
          $ref: '#/components/schemas/Active'
        onHold:
          $ref: '#/components/schemas/OnHold'
        locked:
          $ref: '#/components/schemas/Locked'
        reset:
          $ref: '#/components/schemas/Reset'
        registered:
          $ref: '#/components/schemas/Registered'
        approved:
          $ref: '#/components/schemas/Approved'
        rejected:
          $ref: '#/components/schemas/Rejected'
        invalidEmailAddress:
          $ref: '#/components/schemas/InvalidEmailAddress'
        additionalInfo:
          $ref: '#/components/schemas/StatusAdditionalInfo'
    Error4:
      description: >-
        Standard error object containing an application-specific error code and
        a descriptive message explaining the issue.
      type: object
      properties:
        code:
          description: Application-specific error code.
          type: string
          example: ISR_10001
        message:
          description: Detailed description of the error.
          type: string
          example: InstitutionUser not found.
    SearchCriteriaRequestBody:
      type: object
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          format: date-time
          description: Start range for search in ISO-8601 date/time/time-zone format.
        endTime:
          type: string
          format: date-time
          description: End range for search in ISO-8601 date/time/time-zone format.
        pageSize:
          type: integer
          description: >
            The size limit for number of banking activities per response. The
            server can always override this value as needed and

            thus the limit passed can not be guaranteed. However, server will
            try to honor the limit when it can.
          example: 200
        eventIds:
          type: array
          items:
            type: string
            description: Event identifier
          description: >-
            List of event identifiers to filter on. When not present, the API
            will return all events matching other criterias.
          example:
            - mfaChallenge
            - mfaEnrollment
        userType:
          type: string
          description: >-
            The type of user requested. When not specified, result will contain
            both user types.
          enum:
            - retail
            - business
          example: retail
        userIdType:
          type: string
          description: >-
            The type of userId provided. The type must present when userId value
            is present.
          enum:
            - loginId
            - memberId
          example: loginId
        userId:
          type: string
          description: >-
            User's member number or login identifier value based on type
            specified in userIdType.
          example: bbaadmin2
        requestedAttributes:
          type: array
          items:
            type: string
            description: Attribute identifier (case sensitive)
          description: >
            List of attribute identifiers to return in data set. When not
            present, the API will return all attributes.

            Despite the filter, these fields will always be in the response -
            timestamp, eventId, guid, ReqCtx_loginId or

            member (based on the userId type provided), companyId (if it was
            passed without userId).
          example:
            - ReqCtx_appId
            - ReqCtx_ipAddress
            - ReqCtx_locale
            - ReqCtx_loginId
            - ReqCtx_offeringId
            - ReqCtx_onBehalfOf
            - ReqCtx_region
            - ReqCtx_requestURI
            - ReqCtx_sessionId
            - ReqCtx_userProduct
            - ReqCtx_userType
            - cdiChallenged
            - cdiMode
            - challengeStatus
            - challengeType
            - invalidAttempts
            - passcodeSent
            - reason
            - source
            - step
        additionalFilters:
          type: object
          description: >
            Additional filters to be applied and their conditional relation to
            one another. The conditional relation can be `and` or `or`.

            There can be sub group of filters passed if both conditional
            relations are desired.
          items:
            $ref: '#/components/schemas/AdditionalFilters'
          example:
            condition: or
            filters:
              - attributeId: ReqCtx_appId
                criteria: equals
                value: USP
            subFilter:
              condition: and
              filters:
                - attributeId: source
                  criteria: equals
                  value: web
        nextPageToken:
          type: string
          description: >
            Allows retrieval of the next page of banking activities from a
            previous query. A hashed value of last index sent by the server.

            This value needs to be sent as it was received in response.
          example: 00f411a264961a7ec59e82999fb6375f
    AdditionalFilters:
      type: object
      required:
        - condition
        - filters
      properties:
        condition:
          $ref: '#/components/schemas/Condition'
        filters:
          $ref: '#/components/schemas/Filters'
        subFilter:
          $ref: '#/components/schemas/SubFilter'
    SubFilter:
      type: object
      description: A sub group filtering to combine filters of different condition.
      required:
        - condition
        - filters
      properties:
        condition:
          $ref: '#/components/schemas/Condition'
        filters:
          $ref: '#/components/schemas/Filters'
    Condition:
      type: string
      description: The condition enum to apply to the list of filters.
      enum:
        - and
        - or
    Filters:
      type: array
      description: A list of filters.
      items:
        $ref: '#/components/schemas/Filter'
    Filter:
      type: object
      required:
        - attributeId
        - criteria
      properties:
        attributeId:
          type: string
          description: Attribute identifier.
        criteria:
          type: string
          enum:
            - equals
            - like
            - isPresent
          description: >
            One of "equals", "like" and "isPresent". "notEqual" is not
            supported. "like" criteria accepts RE2 regex.

            A general wildcard search in RE2 looks like these `.*107` for
            searching all values for given attribute that ends in `107`, 
            `.*107.*`

            for searching all values for given attribute that contains `107`,
            `107.*` for searching all values for given attribute that starts
            with `107`.

            For more information to use RE2 regex syntax, visit
            https://github.com/google/re2/wiki/Syntax
        value:
          type: string
          description: >-
            Value of attribute to search for. The value is ignored for
            "isPresent" criteria.
      example:
        attributeId: ReqCtx_appId
        criteria: equals
        value: USP
    SearchResultResponse:
      type: object
      properties:
        bankingActivities:
          type: array
          items:
            $ref: '#/components/schemas/BankingActivity'
          description: >-
            List of banking activities that match given request. The banking
            activity will contain only requested attributes if present in
            request.
        nextPageToken:
          type: string
          description: >
            Allows retrieval of the next page of banking activities from a
            previous query. This value needs to be sent as it was received in
            response.

            If this value is null or not present, there are no further banking
            activities to fetch.
          example: e5a164f1441722fef32ecb70605ff751
    BankingActivity:
      type: object
      description: Banking Activity object with attribute and value key pairs.
      example:
        timeStamp: '2020-02-27T08:07:16.521-08:00'
        eventId: mfaChallenge
        guid: d528a8921a37c13ga1234
        ReqCtx_appId: USP
        ReqCtx_ipAddress: 165.225.106.120
        ReqCtx_locale: en_US
        ReqCtx_loginId: bbaadmin2
        ReqCtx_offeringId: USPServer
        ReqCtx_onBehalfOf: 14
        ReqCtx_region: qa
        ReqCtx_requestURI: /usp-core/app/mfa
        ReqCtx_sessionId: 7123f1be7bcd4bd2a726a21cf563b5a7
        ReqCtx_userProduct: USP
        ReqCtx_userType: SECONDARY_ADMIN
        cdiChallenged: 'No'
        cdiMode: N/A
        challengeStatus: N/A
        challengeType: N/A
        invalidAttempts: 0
        passcodeSent: 'Yes'
        reason: mfa
        source: Web
        step: Challenge presented
    Error5:
      type: object
      properties:
        errorCode:
          description: Application-specific error code.
          type: string
        errorMessage:
          description: Detailed description of the error.
          type: string
    User:
