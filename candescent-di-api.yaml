      ## Endpoints
paths:
  /db-accounts/v1/accounts:
    get:
      summary: List customer accounts
      description: >
        Retrieves all accounts associated with the authenticated customer.
        Returns account details including balances, account numbers, and status.


        **Key Features:**

        - Returns **Cross Accounts** by default (use `crossAccount=false` to
        exclude)

        - Filter accounts by category using ODATA `$filter` expressions
        (DEPOSIT, LOAN, INVESTMENT, TIERED_LOAN, CROSS_USER_ACCOUNT)

        - Retrieve accounts for Business Banking entities using
        `$apply=groupBy(customer)` with pagination

        - Control response detail level with `viewName` parameter (`s` for
        small, `m` for medium)


        **Business Banking Users:** Include `institutionCustomerId` parameter
        for business context.


        **Example Filter:** `$filter=category eq 'DEPOSIT'` returns only deposit
        accounts.
      operationId: listAccountsV1
      tags:
        - Accounts
      parameters:
        - name: transactionId
          in: header
          description: A unique identifier for this request.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          description: >-
            Standard OAuth 2.0 access token. A string composed of 'Bearer' +
            '(space)' + '{token}'
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: hostUserId
          in: query
          required: false
          description: >
            Identifier for the user associated with the financial institution.
            This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `loginId` query parameter.
          schema:
            type: string
        - name: loginId
          in: query
          required: false
          description: >
            Login identifier for the user associated with the financial
            institution. This parameter is **required** when the access

            token was issued using the `client_credentials` grant type;
            otherwise, it is optional.

            Cannot be used with `hostUserId` query parameter.
          schema:
            type: string
        - name: viewName
          in: query
          description: |
            Filters the returned fields based on the provided view name.
            Can be:
            - `s` - Small view
            - `m` - Medium view
          schema:
            type: string
        - name: crossAccount
          in: query
          description: Excludes cross user accounts from the response when false.
          schema:
            type: boolean
            default: true
        - name: $filter
          in: query
          description: >
            An ODATA filter expression to apply to the returned accounts.


            **Allowed fields:**

            - `id` - Unique account identifier

            - `nickName` - Customer-defined account nickname

            - `accountNumber` - Account number (last 4 digits)

            - `category` - Account category


            **Category values:** DEPOSIT, LOAN, INVESTMENT, TIERED_LOAN,
            CROSS_USER_ACCOUNT


            **Example:** `$filter=category eq 'DEPOSIT'`
          schema:
            type: string
        - name: additionalFields
          in: query
          description: Provides additional fields for each account when true.
          schema:
            type: boolean
            default: false
        - name: $apply
          in: query
          description: >
            When passed along with $skipGroups and $topGroups (all three must be
            provided), accounts will be returned for all institution customers
            that the user has access to, grouped by the specified field.
            Currently only grouping by customer is supported.

            Must be:

            - `groupBy(customer)`
          schema:
            type: string
        - name: $skipGroups
          in: query
          description: >-
            Skips the specified number of groups in the response. Must be
            between 0 and [total number of institution customers in the JWT] - 1
          schema:
            type: string
        - name: $topGroups
          in: query
          description: >
            Returns the top n groups in the response. Currently only a value of
            "1" is supported.

            Must be:

            - `1`
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounts'
            application/xml:
              schema:
                $ref: '#/components/schemas/Accounts'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        '404':
