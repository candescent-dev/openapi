  /auth-code/v1/auth-code:
    post:
      summary: Get authorization code
      description: >
        Generates an authorization code for OAuth 2.0 authorization code flow.
        The returned code can be exchanged

        for an access token at the token endpoint.
      operationId: getAuthorizationCodeV1
      tags:
        - Authentication
      parameters:
        - name: transactionId
          in: header
          description: A unique identifier for this request.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          description: >-
            Standard OAuth 2.0 access token. A string composed of 'Bearer' +
            '(space)' + '{token}'
          schema:
            type: string
            example: Bearer 18FaavwuGejYXBhj7grtrP57ZbCX
            description: Bearer token
        - name: institutionId
          in: header
          required: true
          description: Numeric unique id of the financial institution
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                scopes:
                  description: Scopes of the access request
                  type: string
                requested_scopes:
                  description: Scopes of the oidc request
                  type: string
                client_id:
                  description: Apigee app key for client app.
                  type: string
                username:
                  description: >-
                    Unique Identifier for the Institution User being
                    authenticated
                  type: string
                institution_user_id:
                  description: >-
                    Unique Identifier for the Institution User being
                    authenticated
                  type: string
                nonce:
                  description: >-
                    Unique Identifier for the Open Id Connect authorization code
                    request
                  type: string
                aud:
                  description: audience for the Open Id Connect auth code request
                  type: string
                auth_time:
                  description: authorization time for the Open Id Connect auth code request
                  type: string
              required:
                - scopes
                - requested_scopes
                - client_id
                - username
                - institution_user_id
        required: true
      responses:
        '200':
          description: Success
          headers:
            transactionid:
              description: The transaction ID that was sent as a header in the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCode'
        '400':
          description: Bad request
          headers:
            transactionid:
              description: The transaction ID that was sent as a header in the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo2'
        '500':
          description: Server error
          headers:
            transactionid:
              description: The transaction ID that was sent as a header in the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo2'
